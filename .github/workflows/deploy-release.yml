name: Deploy published Assistant release

# Production follows the stable releases: when a release is published as stable, or a pre-release is promoted to a
# release, its verified CAR is deployed. Pre-releases (previews) never deploy on their own. A maintainer can still
# start the workflow by hand, for development or to deploy a release again.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy (for example v1.4.49)
        required: true
        type: string
      target:
        description: Deployment environment
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: assistant-deployment-${{ github.event_name == 'release' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || inputs.target }}
    env:
      C8O_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      C8O_DEPLOY_TARGET: ${{ github.event_name == 'release' && 'production' || inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Download and verify the published CAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_deployment.py
      - name: Deploy the verified CAR without rebuilding
        env:
          C8O_SERVER: ${{ env.C8O_DEPLOY_TARGET == 'production' && secrets.C8O_SERVER_PROD || env.C8O_DEPLOY_TARGET == 'development' && secrets.C8O_SERVER || '' }}
          C8O_USER: ${{ env.C8O_DEPLOY_TARGET == 'production' && secrets.C8O_USER_PROD || env.C8O_DEPLOY_TARGET == 'development' && secrets.C8O_USER || '' }}
          C8O_PASSWORD: ${{ env.C8O_DEPLOY_TARGET == 'production' && secrets.C8O_PASSWORD_PROD || env.C8O_DEPLOY_TARGET == 'development' && secrets.C8O_PASSWORD || '' }}
        # load starts the Convertigo engine (deploy logs through it and fails with a null logger without it); it reads
        # the checked-out source in memory and builds nothing. The deployed archive stays the verified published CAR.
        run: sh gradlew --console=plain --init-script .github/scripts/deploy-published.gradle load deploy -x car

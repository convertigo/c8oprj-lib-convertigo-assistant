# Pushes and tags build archives only. Every newly tagged release starts as a
# pre-release; stable promotion is an explicit reviewed operation.
# Deployment is never part of this workflow, even without [skip deploy].

name: Convertigo CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  credential-files-windows:
    name: Native Windows credential permissions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Test real NTFS ACLs and atomic credential replacement
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native-credentials | Out-Null
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.jar' -OutFile build/rhino.jar
          if ((Get-FileHash build/rhino.jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2427fdcbc149ca0a25ccfbb7c71b01f39ad42708773a47816cd2342861766b63') { throw 'Rhino checksum mismatch' }
          javac --release 17 -cp build/rhino.jar -d build/native-credentials tests/java/TigoAccessFilesNativeTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
          java -cp 'build/rhino.jar;build/native-credentials' TigoAccessFilesNativeTest js/tigo_access_files.js
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows credential test failed' }
      - name: Test credential failure diagnostics
        run: node --test tests/tigo_access_files.test.cjs

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
            path: |
               ~/.gradle/caches
               ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-caches-v1-${{ hashFiles('**/*.gradle', '**/gradle/wrapper/gradle-wrapper.properties') }}
            restore-keys: ${{ runner.os }}-gradle-caches-v1-

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
            path: |
              ${{ github.workspace }}/_private/ionic/node_modules
              ${{ github.workspace }}/_private/ionic/.angular
              /home/runner/convertigo/nodes
            key: ${{ runner.os }}-build-node-${{ hashFiles('**/package.json', '**/_private/ionic/version.json') }}
            restore-keys: ${{ runner.os }}-build-node-

      - name: Convertigo generate application code
        env:
          C8O_SERVER: ${{ github.ref_type == 'tag' && secrets.C8O_SERVER_PROD || secrets.C8O_SERVER }}
        run: |
          PROJECT_VERSION_ARG=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PROJECT_VERSION_ARG+=("-Pconvertigo.load.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          echo "Generate Mobile Builder App" && \
          sh gradlew --stacktrace --info generateMobileBuilder export -x compileMobileBuilder \
            "${PROJECT_VERSION_ARG[@]}" \
            -Pconvertigo.load.mobileApplicationEndpoint=$C8O_SERVER

      - name: Build CAR without deployment
        run: |
          PROJECT_VERSION_ARG=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PROJECT_VERSION_ARG+=("-Pconvertigo.load.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          echo "Building CAR without deployment"
          sh gradlew --stacktrace --info car -x generateMobileBuilder \
            "${PROJECT_VERSION_ARG[@]}"

      - name: Save application project
        uses: actions/upload-artifact@v4
        with:
          name: project
          path: build/*.car

      - name: Save channel manifests
        uses: actions/upload-artifact@v4
        with:
          name: channels
          path: |
            stack-release.json
            stack-release-stable.json
            stack-release-preview.json

  release:
    if: github.ref_type == 'tag'
    needs: [build, credential-files-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download CAR File
        uses: actions/download-artifact@v4
        with:
          name: project

      - name: Download channel manifests
        uses: actions/download-artifact@v4
        with:
          name: channels

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.car
            stack-release.json
            stack-release-stable.json
            stack-release-preview.json
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

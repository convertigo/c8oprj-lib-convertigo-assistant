accessibility: Hidden
comment: '"Confirmer avant de modifier" of a No Code user (js/agent_write_confirm.js): reads (status) or sets (set, with enabled) the user''s choice, kept for them and published for the Convertigo MCP, answers a change waiting for confirmation (answer, with threadid, requestId and decision: allow, allow_turn or refuse), or closes the cards of a turn that ended (turn_end, with threadid). Always for the authenticated user, never one the page names.'

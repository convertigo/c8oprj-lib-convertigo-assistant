accessibility: Hidden
comment: The whole text of the long model reasoning blocks of a conversation (runs/<runid>.reasoning), for the "show all" of the Tigo work log. Only the caller's own conversations.
includeResponseElement: false
↓Run [steps.SimpleStep-1794620000001]: 
  expression: |
    'include("js/agent_bridge_client.js");
    try {
        response = C8O.assistantAgentBridge.reasoningText({
            threadid: typeof threadid === "undefined" ? "" : String(threadid || ""),
            parts: typeof parts === "undefined" ? "" : String(parts || ""),
            userId: typeof userId === "undefined" ? "" : String(userId || "")
        });
    } catch (e) {
        response = {ok:false,error:{code:"read_error"}};
    }'

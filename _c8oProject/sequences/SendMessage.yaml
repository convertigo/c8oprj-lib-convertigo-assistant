↓StreamRun [steps.SimpleStep-1749283782808]: 
  expression: |
    '// Required Java classes
    // log.warn("Starting stream read"); // Log the received line)
    
    var URL = java.net.URL;
    var HttpsURLConnection = java.net.HttpURLConnection;
    var InputStreamReader = java.io.InputStreamReader;
    var BufferedReader = java.io.BufferedReader;
    
    // Set your API key and thread/run info
    var apiKey = "${lib_C8Oforms_AI.GPT.apikey.secret}";
    var url = new URL("https://api.openai.com/v1/threads/" + threadid + "/runs");
    
    var conn = url.openConnection();
    conn.setRequestMethod("POST");
    conn.setRequestProperty("Authorization", "Bearer " + apiKey);
    conn.setRequestProperty("OpenAI-Beta", "assistants=v2");
    conn.setRequestProperty("Content-Type", "application/json");
    conn.setRequestProperty("Accept", "text/event-stream");
    conn.setDoOutput(true);
    
    // Enable streaming mode
    var payload = JSON.stringify({
      assistant_id: "asst_iLSiB5Gu0EkkJArAwuC6aET3",
      stream: true
    });
    
    
    // log.warn("About to call API with apiKey: " + apiKey + " and URL: " + url); 
    
    var out = new java.io.OutputStreamWriter(conn.getOutputStream());
    out.write(payload);
    out.close();
    
    
    // Read streaming response
    var reader = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
    var line;
    
    
    while ((line = reader.readLine()) !== null) {
    //	log.warn("Received line: " + line); // Log the received line)
    	if (line.trim() === "") {
    		continue; // Skip empty lines
    	}
    	if (line.startsWith("data: ")) {
    		var data = line.substring(6).trim(); // Remove "data: " prefix
    		try {
    			var response = JSON.parse(data);
    			var buffer = context.httpSession.getAttribute("C8OAiAssistantBuffer");
    			
    			if (buffer && response.delta && line != "data: [DONE]") {
    				log.warn("Buffer from get attribute is : " + JSON.stringify(buffer)); 
    				buffer.content += response.delta.content[0].text.value;
    				buffer.size += buffer.content.length;
    				context.httpSession.setAttribute("C8OAiAssistantBuffer", buffer);
    			}			
    		} catch (e) {
    			log.error("Error parsing JSON: " + "\nERROR" +  e.message + "\nLINE: " + line);
    		}
    	}
    }
    
    reader.close();
    // log.warn("Finished stream read"); // Log the received line)
    '

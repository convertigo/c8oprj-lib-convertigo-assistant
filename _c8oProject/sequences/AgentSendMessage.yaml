    promptParts.push("- MCP endpoint: " + _agentTrim(typeof mcpEndpoint === "undefined" ? "" : mcpEndpoint));
    promptParts.push("");
    promptParts.push("Operational rules:");
    promptParts.push("- Use the Convertigo MCP/tools exposed to you whenever you need to inspect or change Convertigo objects.");
    promptParts.push(_isNoCodeSurface ? "- Use the Convertigo NoCode workflow and vocabulary. Prefer forms, applications, pages, fields, data sources, roles, publication, and permissions over Eclipse Studio terminology." : "- Work only on the selected Convertigo project unless the user explicitly asks for another project.");
    promptParts.push(_isNoCodeSurface ? "- If a specific form, application, page, or data source is needed but not identified by the current context, inspect the available NoCode/C8Oforms resources first, then ask a focused clarification only if still ambiguous." : "- If no project is selected and the user asks for project changes, ask them to select a project first.");

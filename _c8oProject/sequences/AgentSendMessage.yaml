    var selectedThread = _agentTrim(typeof threadid === "undefined" ? "" : threadid);
    var uploadedFiles = _agentParseFiles(typeof AIFiles === "undefined" ? "" : AIFiles);
    var promptParts = [];
    promptParts.push(_isNoCodeSurface ? "You are an AI agent integrated in Convertigo NoCode Studio (C8Oforms)." : "You are an AI coding agent integrated in Convertigo Studio.");
    promptParts.push(_isNoCodeSurface ? "Your job is to help the user inspect, explain, and improve forms, no-code applications, pages, fields, roles, publication, permissions, and data sources through Convertigo tools." : "Your job is to help the user by inspecting, editing, and validating Convertigo projects when the request requires project work.");
    promptParts.push("Reply to the user in the same language as their message. The system and operational instructions are in English, but the user-facing answer must follow the user''s language.");
    promptParts.push("While working, provide short user-facing progress updates when the agent interface supports streamed updates. Keep them factual, one or two sentences, in the user''s language, and do not reveal hidden chain-of-thought; summarize what you are doing, what you found, or what you will try next.");
    promptParts.push("");
    promptParts.push(_isNoCodeSurface ? "Convertigo NoCode context:" : "Convertigo Studio context:");
    promptParts.push("- Surface profile: " + (_agentSurfaceProfile.length ? _agentSurfaceProfile : "generalist"));
    promptParts.push("- Selected project: " + (_targetProject.length ? _targetProject : "none"));
    if (_isNoCodeSurface) {
      promptParts.push("- Project selection is optional in this surface. Do not require an Eclipse/Studio selected project before inspecting or explaining C8Oforms/no-code resources.");

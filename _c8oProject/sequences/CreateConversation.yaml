    ↓BuildThreadMsg [steps.SimpleStep-1749567488945]: 
      expression: |
        'with (new JavaImporter(
        )) {
        	function findMatchingObject(jsonObject) {
        		if (''JsonResponse'' in jsonObject) {
        			return findMatchingObject(jsonObject.JsonResponse)
        		} else if (jsonObject.css && jsonObject.typescript && jsonObject.XHTML && jsonObject.variables) {
        			return jsonObject;
        		}
        		return null;
        	}
        	
        	function extractJSONFromMarkdown(md) {
        	  let jsonOb = null;
        	  try {
        		  jsonOb = findMatchingObject(JSON.parse(md));
        	  } catch (e) {
        		  log.error("Failed to parse JSON: "+ e.message);
        		  
        		  const jsonCodeBlockRegex = /```json\s*([\s\S]*?)\s*```/gi;
        		  const matches = md.matchAll(jsonCodeBlockRegex);
        		  if (matches) {
        			  for (var match of matches) {
        				  //log.warn("MATCH: "+ match[0]);
        				  try {
        				      let parsed = JSON.parse(match[1]);
        				      //log.warn("JSON: "+ match[1]);
        				      //log.warn("JSON p: "+ JSON.stringify(parsed));
        				      //log.warn("JSON css: "+ parsed.css);
        					  jsonOb = findMatchingObject(parsed);
        					  if (jsonOb != null) {
        						  break;
        					  }
        				  } catch (e) {
        					  log.error("Failed to parse JSON: "+ e.message);
        				  }
        			  }
        		  } else {
        			  log.error("No JSON code block found.");
        		  }
        	  }
        	  return jsonOb;
        	}
        	
        	function buildMsg(Messages) {
        		var data = [];
        		for (let i = 0; i < Messages.length; i++) {
        			let message = Messages[i];
        			if (message.role && message.text != null && message.text != "") {
        				//log.warn("Extract JSON from message "+ message.id +":\n"+ message.text);
        				log.warn("Extract JSON from message "+ message.id);
        				try {
        					var text = message.text;
        					if (message.role == "assistant") {
        						let jsonOb = extractJSONFromMarkdown(message.text);
        						if (jsonOb != null) {
        							text = jsonOb.explanation;
        						} else {
        							text = "explanation: invalid or not found";
        						}
        					}
        					log.warn("Text from message "+ text);
        					let msg = {
        						type: message.role,
        						msg: text,
        						id: message.id,
        					}
        					data.push(msg);
        				} catch (e) {
        					log.error("Failed to handle message "+ message.id +": "+ e.message);
        				}
        			}
        		}
        		
        		var jsonAData = {
        			"messages": data,
        			"threadid": threadid,
        		};
        
        		return jsonAData;
        	}
        	
        	AIData = buildMsg(Messages);
        }
        '

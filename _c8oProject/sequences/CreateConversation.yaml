    ↓BuildThreadMsg [steps.SimpleStep-1749567488945]: 
      expression: |
        'with (new JavaImporter(
        )) {
        	include("js/format.js");
        	
        	function getExplanation(jsonObject) {
        		try {
        			if (''JsonResponse'' in jsonObject) {
        				return jsonObject.JsonResponse.explanation;
        			} else if (''JsonChanges'' in jsonObject) {
        				if (''explanation'' in jsonObject) {
        					return jsonObject.explanation;
        				}
        				let patches = jsonObject.JsonChanges;
        				for (let i = 0; i < patches.length; i++) {
        					let patch = patches[i];
        					if (patch.path == "/explanation") {
        						return patch.value;
        					}
        				}
        			}
        		} catch (e) {
        			log.error("Failed to getExplanation "+ e.message);
        		}
        		return null;
        	}
        	
        	function buildMsg(Messages) {
        		var data = [];
        		for (let i = 0; i < Messages.length; i++) {
        			let message = Messages[i];
        			if (message.role && message.text != null && message.text != "") {
        				log.debug("(buildMsg) Extract JSON from message "+ message.id);
        				try {
        					var text = null;
        					if (message.role == "user") {
        						text = message.text;
        					} else if (message.role == "assistant") {
        						let json = message.text;
        						//Just to log invalid json string and try to fix it
        						try {
        							JSON.parse(json);
        						} catch (e) {
        							log.warn("(buildMsg) Invalid json string for message "+ message.id +": "+ e.message + "\n"+ message.text);
        							json = fixMalformedJson(message.text);
        						}//
        						
        						text = getExplanation(JSON.parse(json));
        					}
        					
        					if (text == null || text == undefined) {
        						text = "explanation: invalid or not found";
        					}
        					
        					let msg = {
        						type: message.role,
        						id: message.id,
        						msg: text,
        					}
        					data.push(msg);
        				} catch (e) {
        					log.error("(buildMsg) Failed to handle message "+ message.id +": "+ e.message);
        				}
        			}
        		}
        		
        		var jsonAData = {
        			"threadid": threadid,
        			"messages": data
        		};
        
        		return jsonAData;
        	}
        	
        	AIData = buildMsg(Messages);
        }
        '

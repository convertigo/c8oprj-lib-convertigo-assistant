        											customCMarker = customCMarker.replace(line, "//"+ line);
        										}
        									}*/
        									//log.warn("customCMarker:\n"+ customCMarker);		
        									scriptContent = scriptContent.replace(constructorMarker, customCMarker);
        								} catch(e) {
        									log.error("Failed to handle typescript constructor: "+ e.message);
        								}
        								
        								// get declarations
        								try {
        									var delarationMarker = NgxBuilder.getMarker(scriptContent, "CompDeclaration");
        									var customDMarker = NgxBuilder.getMarker(jsonOb.typescript, "CompDeclaration");
        									/*var lines = customDMarker.split(''\\R'');
        									for (var line of lines) {
        										for (let key in jsonOb.variables) {
        											var re = new RegExp(key+"\\b");
        											if (line.search(re) != -1) {
        												customDMarker = customDMarker.replace(line, "//"+ line);
        											}
        										}
        									}*/				
        									scriptContent = scriptContent.replace(delarationMarker, customDMarker);
        								} catch(e) {
        									log.error("Failed to handle typescript declarations: "+ e.message);
        								}
        								
        								// get functions
        								try {
        									var functionMarker = NgxBuilder.getMarker(scriptContent, "CompFunction");
        									var customFMarker = NgxBuilder.getMarker(jsonOb.typescript, "CompFunction");
        									scriptContent = scriptContent.replace(functionMarker, customFMarker);
        								} catch(e) {
        									log.error("Failed to handle typescript functions: "+ e.message);
        								}
        							
        								comp.setScriptContent(new FormatedContent(scriptContent));
        								log.warn("comp scriptContent:\n"+ comp.getScriptContent().getString());
        							} catch (e) {
        								log.error("Failed to set typescript content: "+ e.message);
        							}
        							
        							clipboard.add(comp);
        							break; // keep only last from thread !!!
        						}
        					} catch (e) {
        						log.error("Failed to handle Messages: "+ e.message);
        					}
        				} else {
        					log.error("Failed to retrieve Json");
        				}
        			}
        		}
        		var xml = clipboard.toXml();
        		const end = Date.now();
        		log.warn("Clipboard generated in "+ Math.floor(end - start) + " ms");
        		log.warn("Clipboard xml:\n"+ xml);
        		return xml;
        	}
        	
        	ClipboardXml = getComponentFromMessages(Messages);
        }

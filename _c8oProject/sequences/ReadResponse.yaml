      expression: |
        'with (new JavaImporter(
        	com.twinsoft.convertigo.beans.common.FormatedContent,
        	com.twinsoft.convertigo.beans.ngx.components.dynamic.IonBean,
        	com.twinsoft.convertigo.beans.ngx.components.dynamic.ComponentManager,
        	com.twinsoft.convertigo.beans.ngx.components.MobileSmartSourceType.Mode,
        	com.twinsoft.convertigo.beans.ngx.components.MobileSmartSourceType,
        	com.twinsoft.convertigo.beans.ngx.components.UIDynamicElement,
        	com.twinsoft.convertigo.engine.mobile.NgxBuilder,
        	com.twinsoft.convertigo.engine.util.Clipboard,
        	org.jsoup.parser.ParseSettings,
        	org.jsoup.parser.Parser,
        	org.jsoup.Jsoup,
        )) {
        	function findMatchingObject(jsonObject) {
        		if (''JsonResponse'' in jsonObject) {
        			return findMatchingObject(jsonObject.JsonResponse)
        		} else if (jsonObject.css && jsonObject.typescript && jsonObject.XHTML && jsonObject.variables) {
        			return jsonObject;
        		}
        		return null;
        	}
        	
        	function extractJSONFromMarkdown(md) {
        	  let jsonOb = null;
        	  try {
        		  jsonOb = findMatchingObject(JSON.parse(md));
        	  } catch (e) {
        		  log.error("Failed to parse JSON: "+ e.message);
        		  
        		  const jsonCodeBlockRegex = /```json\s*([\s\S]*?)\s*```/gi;
        		  const matches = md.matchAll(jsonCodeBlockRegex);
        		  if (matches) {
        			  for (var match of matches) {
        				  log.warn("MATCH: "+ match[0]);
        				  try {
        				      let parsed = JSON.parse(match[1]);
        				      log.warn("JSON: "+ match[1]);
        				      log.warn("JSON p: "+ JSON.stringify(parsed));
        				      log.warn("JSON css: "+ parsed.css);
        					  jsonOb = findMatchingObject(parsed);
        					  if (jsonOb != null) {
        						  break;
        					  }
        				  } catch (e) {
        					  log.error("Failed to parse JSON: "+ e.message);
        				  }
        			  }
        		  } else {
        			  log.error("No JSON code block found.");
        		  }
        	  }
        	  return jsonOb;
        	}
        	
        	function getBeanKey(tag) {
        		var cm = ComponentManager.of(context.project);
        		var beanKey = undefined;
        		if (cm != null) {
        			try {
        				var map = cm.getIonBeans();
        				for (let key of map.keySet()) {
        				  if (tag == map.get(key).getTag()) {
        				  	  //log.warn(key);
        					  beanKey = key;
        					  if ("FSImage" == beanKey) {
        						  beanKey = "Image";
        					  }
        					  break;
        				  }
        				}
        			} catch (e) {
        				log.error("Failed to getBeanKey: "+ e.message);
        			}
        		}
        		return beanKey;
        	}
        	
        	function setBeanProperty(a, dbo) {
        		var bRet = false;
        		try {
        			if (dbo != null) {
        				var cm = ComponentManager.of(context.project);
        				var akey = ""+a.getKey();
        				var aval = ""+a.getValue();
        				//log.warn("1- setBeanProperty a:"+ akey + "=" + aval + ", dbo:" + dbo.getClass());
        				
        				var fake = new UIDynamicElement();
        				if (fake.getClass().isAssignableFrom(dbo.getClass())) {
        					//log.warn("2- setBeanProperty UIDynamicElement: true");
        					dbo.loadBean(cm);
        					var ionBean = dbo.getIonBean();
        					if (ionBean != null) {
        						//log.warn("3- setBeanProperty ionBean Ok");
        						let map = ionBean.getProperties();
        						for (let key of map.keySet()) {
        							let property = map.get(key);
        							//log.warn("4- setBeanProperty property:" + property);
        							var pname = property.getName();
        							var pattr = property.getAttr();
        							pattr = pattr == "" ? pname : pattr;
        							if (akey == pattr && akey !== "class") {
        								log.warn("5- setBeanProperty for: " + akey + ", prop:"+ property);
        								
        								var value = aval.trim();
        								
        								var mode = MobileSmartSourceType.Mode.PLAIN;
        								if (akey.startsWith("[") && akey.endsWith("]")) {
        									mode = MobileSmartSourceType.Mode.SCRIPT;
        								}
        								if (value.startsWith("{{") && value.endsWith("}}")) {
        									mode = MobileSmartSourceType.Mode.SCRIPT;
        									value = value.replace("{{","").replace("}}","").trim();
        								}
        								
        								var msst = new MobileSmartSourceType();
        								msst.setMode(mode);
        								msst.setSmartValue(value);
        								
        								ionBean.setPropertyValue(pname, msst);
        								
        								bRet = true;
        								break;
        							}
        						}
        						
        						dbo.saveBean();
        					}
        				} else {
        					log.warn("2- setBeanProperty UIDynamicElement: false");
        					//....
        				}
        			}
        		} catch (e) {
        			log.error("Failed to setBeanProperty: "+ e.message);
        		}
        		return bRet;
        	}
        	
        	function parseText(template) {
        	  const regex = /\{\{\s*(.*?)\s*\}\}/g;
        	  let result = [];
        	  let lastIndex = 0;
        	
        	  let match;
        	  while ((match = regex.exec(template)) !== null) {
        	    // Texte statique avant l''expression
        	    if (match.index > lastIndex) {
        	      result.push({
        	        type: ''text'',
        	        value: template.slice(lastIndex, match.index)
        	      });
        	    }
        	
        	    // Expression
        	    result.push({
        	      type: ''expression'',
        	      value: match[1]
        	    });
        	
        	    lastIndex = regex.lastIndex;
        	  }
        	
        	  // Texte statique restant après la dernière expression
        	  if (lastIndex < template.length) {
        	    result.push({
        	      type: ''text'',
        	      value: template.slice(lastIndex)
        	    });
        	  }
        	
        	  return result;
        	}
        	
        	function createBeans(e, parent) {
        		try {
        			var dbo = null;
        			var cm = ComponentManager.of(context.project);
        			var tag = e.nodeName();
        			var key = getBeanKey(tag);
        			//log.warn("createBeans for "+ e.nodeName());
        			if (key == undefined) {
        				dbo = cm.createBean(cm.getComponentByName("UIElement"));
        				dbo.setTagName(tag);
        				//log.warn("Dbo created with Tag "+ tag);
        			} else {
        				dbo = cm.createBean(cm.getComponentByName(key));
        				//log.warn("Dbo created with "+ key);
        			}
        			if (parent != null && dbo != null) {
        				parent.add(dbo);
        			}
        			if (dbo != null) {
        				e.attributes().forEach((a) => {
        					if (!setBeanProperty(a, dbo)) {
        						var akey = ""+a.getKey();
        						var aval = ""+a.getValue();
        						
        						var value = aval.trim();
        						var mode = MobileSmartSourceType.Mode.PLAIN;
        						if (akey.startsWith("[") && akey.endsWith("]")) {
        							mode = MobileSmartSourceType.Mode.SCRIPT;
        						}
        						var msst = new MobileSmartSourceType();
        						msst.setMode(mode);
        						msst.setSmartValue(value);
        						
        						var dbo_attr = cm.createBean(cm.getComponentByName("UIAttribute"));
        						dbo_attr.setAttrName(akey);
        						dbo_attr.setAttrSmartType(msst);
        						dbo.add(dbo_attr);
        					}
        				});
        			}
        			if (e.hasText() && dbo != null) {
        				e.textNodes().forEach((node) => {
        					if (!node.isBlank()) {
        						var text = node.text().trim().trimEnd();
        						var parsed = parseText(text);
        						parsed.forEach(item => {
        						  var value = item.value;
        						  var mode = item.type == ''text'' ? MobileSmartSourceType.Mode.PLAIN : MobileSmartSourceType.Mode.SCRIPT;
        						  var msst = new MobileSmartSourceType();
        						  msst.setMode(mode);
        						  msst.setSmartValue(value);
        						  var dbo_text = cm.createBean(cm.getComponentByName("UIText"));
        						  dbo_text.setTextSmartType(msst);
        						  dbo.add(dbo_text);
        						});						
        					}
        				});
        			}
        			if (e.childrenSize() > 0) {
        				e.children().forEach((child) => {
        					createBeans(child, dbo);
        				});
        			}
        			return dbo;
        		} catch (e) {
        			log.error("Failed to createBeans: "+ e.message);
        		}
        		return null;
        	}
        	
        	function getComponentFromMessages(Messages) {
        	const start = Date.now();
        	var scriptContent = `
        	/*Begin_c8o_CompImport*/
        	/*End_c8o_CompImport*/
        	/*Begin_c8o_CompDeclaration*/
        	/*End_c8o_CompDeclaration*/
        	/*Begin_c8o_CompConstructor*/
        	/*End_c8o_CompConstructor*/
        	/*Begin_c8o_CompFunction*/
        	/*End_c8o_CompFunction*/
        	`;
        		var clipboard = new Clipboard();
        		for (let i = 0; i < Messages.length; i++) {
        			let message = Messages[i];
        			if (message.role == "assistant" && message.text != null && message.text != "") {
        				msg = {
        					type: "assistant",
        					text: message.text,
        					id: message.id,
        				}
        				log.warn("Extract JSON from:\n"+ msg.text);
        				let jsonOb = extractJSONFromMarkdown(msg.text);
        				if (jsonOb != null) {
        					log.warn("JSON block: "+ JSON.stringify(jsonOb));
        					try {
        						var cm = ComponentManager.of(context.project);
        						var comp = cm.createBean(cm.getComponentByName("UISharedRegularComponent"));
        						if (comp != null) {
        							comp.setComment("-- AI genrated: "+ threadid);
        							
        							// Add dbos from ''XHTML''
        							try {
        								//log.warn("XHTML:\n"+ jsonOb.XHTML);
        								var parser = Parser.htmlParser();
        								parser.settings(new ParseSettings(true, true)); //respect case !!!!!!!!!!
        								var doc = Jsoup.parse("<body>"+jsonOb.XHTML+"</body>", "", parser);
        								doc.body().children().forEach((child) => {
        									createBeans(child, comp);
        								});
        							} catch(e) {
        								log.error("Failed to handle dbos: "+ e.message);
        							}
        							
        							// Add style from ''css''
        							try {
        								//log.warn("css:\n"+ jsonOb.css);
        								var uis = cm.createBean(cm.getComponentByName("UIStyle"));
        								uis.setStyleContent(new FormatedContent(jsonOb.css));
        								comp.add(uis);
        							} catch (e) {
        								log.error("Failed to handle style: "+ e.message);
        							}
        							
        							// Add variables from ''variables''
        							try {
        								//log.warn("variables:\n"+ jsonOb.variables);
        								for (let key in jsonOb.variables) {
        									var value = jsonOb.variables[key];
        									var variable = cm.createBean(cm.getComponentByName("UICompVariable"));
        									variable.setName(key);
        									if ("string" == typeof value) {
        										variable.setVariableValue("''"+ value.replace(/''/g, "\\\\''") +"''");
        									} else if ("object" == typeof value) {
        										variable.setVariableValue(JSON.stringify(value).replace(/"/g, ''\\"''));
        									} else {
        										variable.setVariableValue(""+value);
        									}
        									comp.add(variable);
        								}
        							} catch(e) {
        								log.error("Failed to handle variables: "+ e.message);
        							}
        							
        							// Add typescript form ''typescript''
        							try {
        								log.warn("comp scriptContent:\n"+ scriptContent);
        								
        								// get imports
        								try {
        									var importMarker = NgxBuilder.getMarker(scriptContent, "CompImport");
        									var customIMarker = NgxBuilder.getMarker(jsonOb.typescript, "CompImport");
        									scriptContent = scriptContent.replace(importMarker, customIMarker);
        								} catch(e) {
        									log.error("Failed to handle typescript imports: "+ e.message);
        								}
        								
        								// get constructor
        								try {
        									var constructorMarker = NgxBuilder.getMarker(scriptContent, "CompConstructor");
        									var customCMarker = NgxBuilder.getMarker(jsonOb.typescript, "CompConstructor");

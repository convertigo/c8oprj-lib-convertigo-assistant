    ↓ExtractCodeBlocks [steps.SimpleStep-1744736763321]: 
      expression: |
        '// Regex to match ### filename followed by a code block
        
        function extractJSONFromMarkdown(md) {
          const jsonCodeBlockRegex = /```json\s*([\s\S]*?)\s*```/i;
          const match = md.match(jsonCodeBlockRegex);
          
          if (match && match[1]) {
            try {
              const jsonString = match[1];
              const parsed = JSON.parse(jsonString);
              return parsed;
            } catch (err) {
              log.error("Failed to parse JSON:", err.message);
            }
          } else {
            log.error("No JSON code block found.");
          }
          return null;
        }
        
        
        for (let i = 0; i < Messages.length; i++) {
        	if (Messages[i].role == "assistant" && Messages[i].text != null && Messages[i].text != "") {
        		msg = {
        			type: "assistant",
        			text: Messages[i].text,
        			id: Messages[i].id,
        		}
        		blocks = extractJSONFromMarkdown(msg.text);
        		log.warn(JSON.stringify(blocks));
        	}
        }
        '

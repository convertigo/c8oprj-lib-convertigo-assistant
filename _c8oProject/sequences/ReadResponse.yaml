        		if (data.length > 0) {
        			let jsonOb = data.shift();
        			if (jsonOb != null) {
        				//log.warn("JSON block: "+ JSON.stringify(jsonOb));
        				dataType = data.length == 0 ? "create":"edit";
        				
        				try {

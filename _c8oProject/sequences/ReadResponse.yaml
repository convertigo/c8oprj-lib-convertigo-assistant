        )) {
        	function findMatchingObject(jsonObject) {
        		if (''JsonResponse'' in jsonObject) {
        			return findMatchingObject(jsonObject.JsonResponse)
        		} else if (jsonObject.css && jsonObject.typescript && jsonObject.XHTML && jsonObject.variables) {
        			return jsonObject;
        		}
        		return null;
        	}
        	
        	function extractJSONFromMarkdown(md) {
        	  let jsonOb = null;
        	  try {
        		  jsonOb = findMatchingObject(JSON.parse(md));
        	  } catch (e) {
        		  log.error("Failed to parse JSON: "+ e.message);
        		  
        		  const jsonCodeBlockRegex = /```json\s*([\s\S]*?)\s*```/gi;
        		  const matches = md.matchAll(jsonCodeBlockRegex);
        		  if (matches) {
        			  for (var match of matches) {
        				  log.warn("MATCH: "+ match[0]);
        				  try {
        				      let parsed = JSON.parse(match[1]);
        				      log.warn("JSON: "+ match[1]);
        				      log.warn("JSON p: "+ JSON.stringify(parsed));
        				      log.warn("JSON css: "+ parsed.css);
        					  jsonOb = findMatchingObject(parsed);
        					  if (jsonOb != null) {
        						  break;
        					  }
        				  } catch (e) {
        					  log.error("Failed to parse JSON: "+ e.message);
        				  }
        			  }
        		  } else {
        			  log.error("No JSON code block found.");
        		  }
        	  }
        	  return jsonOb;
        	}
        	
        	function getBeanKey(tag) {
        		var beanKey = undefined;
        		if (cm != null) {
        			try {
        				var map = cm.getIonBeans();
        				for (let key of map.keySet()) {
        				  if (tag == map.get(key).getTag()) {
        				  	  //log.warn(key);
        					  beanKey = key;
        					  if ("FSImage" == beanKey) {
        						  beanKey = "Image";
        					  }
        					  break;
        				  }
        				}
        			} catch (e) {
        				log.error("Failed to getBeanKey: "+ e.message);
        			}
        		}
        		return beanKey;
        	}
        	
        	function setBeanProperty(a, dbo) {
        		var bRet = false;
        		try {
        			if (dbo != null) {
        				var akey = ""+a.getKey();
        				var aval = ""+a.getValue();
        				//log.warn("1- setBeanProperty a:"+ akey + "=" + aval + ", dbo:" + dbo.getClass());
        				
        				var fake = new UIDynamicElement();
        				if (fake.getClass().isAssignableFrom(dbo.getClass())) {
        					//log.warn("2- setBeanProperty UIDynamicElement: true");
        					dbo.loadBean(cm);
        					var ionBean = dbo.getIonBean();
        					if (ionBean != null) {
        						//log.warn("3- setBeanProperty ionBean Ok");
        						let map = ionBean.getProperties();
        						for (let key of map.keySet()) {
        							let property = map.get(key);
        							//log.warn("4- setBeanProperty property:" + property);
        							var pname = property.getName();
        							var pattr = property.getAttr();
        							pattr = pattr == "" ? pname : pattr;
        							if ((akey == pattr || akey == "["+pattr+"]" ) && akey !== "class") {
        								log.warn("5- setBeanProperty for: " + akey + ", prop:"+ property);
        								
        								var value = aval.trim();
        								
        								var mode = MobileSmartSourceType.Mode.PLAIN;
        								if (akey.startsWith("[") && akey.endsWith("]")) {
        									mode = MobileSmartSourceType.Mode.SCRIPT;
        								}
        								if (value.startsWith("{{") && value.endsWith("}}")) {
        									mode = MobileSmartSourceType.Mode.SCRIPT;
        									value = value.replace("{{","").replace("}}","").trim();
        								}
        								
        								var msst = new MobileSmartSourceType();
        								msst.setMode(mode);
        								msst.setSmartValue(value);
        								
        								ionBean.setPropertyValue(pname, msst);
        								
        								bRet = true;
        								break;
        							}
        						}
        						
        						dbo.saveBean();
        					}
        				} else {
        					log.warn("2- setBeanProperty UIDynamicElement: false");
        					//....
        				}
        			}
        		} catch (e) {
        			log.error("Failed to setBeanProperty: "+ e.message);
        		}
        		return bRet;
        	}
        	
        	function parseText(template) {
        	  const regex = /\{\{\s*(.*?)\s*\}\}/g;
        	  let result = [];
        	  let lastIndex = 0;
        	
        	  let match;
        	  while ((match = regex.exec(template)) !== null) {
        	    // Texte statique avant l''expression
        	    if (match.index > lastIndex) {
        	      result.push({
        	        type: ''text'',
        	        value: template.slice(lastIndex, match.index)
        	      });
        	    }
        	
        	    // Expression
        	    result.push({
        	      type: ''expression'',
        	      value: match[1]
        	    });
        	
        	    lastIndex = regex.lastIndex;
        	  }
        	
        	  // Texte statique restant après la dernière expression
        	  if (lastIndex < template.length) {
        	    result.push({
        	      type: ''text'',
        	      value: template.slice(lastIndex)
        	    });
        	  }
        	
        	  return result;
        	}
        
        	function extractComponentNameFromText(sourceCode) {
        		var name = undefined;
        		log.warn("sourceCode\n"+sourceCode);
        		
        		try {
        		    const regex = /export\s*class\s*([\w$]+)\s*implements/;
        		    const match = regex.exec(sourceCode);
        
        		    if (!match) {
        				log.warn("sourceCode no match for name");
        		        return name;
        		    }
        
        		    name = match[1].trim();
        			log.warn("component name\n"+name);
        		} catch (e) {
        			log.error("Failed to extractComponentNameFromText: "+ e.message);
        		}
        		return name;
        	}
        	
        	function extractConstructorParamsMapFromText(sourceCode) {
        	    const paramMap = new Map();
        		log.warn("sourceCode\n"+sourceCode);
        		
        		try {
        		    // Match constructor content
        		    const constructorRegex = /constructor\s*\(([\s\S]*?)\)\s*{/;
        		    const match = constructorRegex.exec(sourceCode);
        		
        		    if (!match) {
        				log.warn("sourceCode no match for constructor");
        		        return paramMap;
        		    }
        		
        		    const paramsString = match[1].trim();
        			log.warn("paramsString\n"+paramsString);
        			
        			const params = paramsString.split(",");
        			log.warn("params\n"+params);
        			
        		    // Regex for name and type
        		    const paramRegex = /(?:public|private|protected)?\s*([\w$]+)\s*:\s*([\w$.<>\[\], \t]+)\s*/;
        		
        		    for (var param of params) {
        		        const paramMatch = paramRegex.exec(param);
        		        if (paramMatch) {
        		            var name = paramMatch[1];
        		            var type = paramMatch[2].trim();
        		            paramMap.set(name, type);
        		        }
        		    }
        		    log.warn("paramMap\n"+ JSON.stringify(Object.fromEntries(paramMap)));
        		    
        		} catch (e) {
        			log.error("Failed to extractConstructorParamsMapFromText: "+ e.message);
        		}
        	    return paramMap;
        	}
        		
        	function createBeans(e, parent) {
        		try {
        			var dbo = null;			
        			var tag = e.nodeName();
        			var key = getBeanKey(tag);
        			//log.warn("createBeans for "+ e.nodeName());
        			if (key == undefined) {
        				dbo = cm.createBean(cm.getComponentByName("UIElement"));
        				dbo.setTagName(tag);
        				//log.warn("Dbo created with Tag "+ tag);
        			} else {
        				dbo = cm.createBean(cm.getComponentByName(key));
        				//log.warn("Dbo created with "+ key);
        			}
        			if (parent != null && dbo != null) {
        				parent.add(dbo);
        			}
        			if (dbo != null) {
        				e.attributes().forEach((a) => {
        					if (!setBeanProperty(a, dbo)) {
        						var akey = ""+a.getKey();
        						var aval = ""+a.getValue();
        						
        						var value = aval.trim();
        						var mode = MobileSmartSourceType.Mode.PLAIN;
        						if (akey.startsWith("[") && akey.endsWith("]")) {
        							mode = MobileSmartSourceType.Mode.SCRIPT;
        						}
        						var msst = new MobileSmartSourceType();
        						msst.setMode(mode);
        						msst.setSmartValue(value);
        						
        						var dbo_attr = cm.createBean(cm.getComponentByName("UIAttribute"));
        						dbo_attr.setAttrName(akey);
        						dbo_attr.setAttrSmartType(msst);
        						dbo.add(dbo_attr);
        					}
        				});
        			}
        			if (e.hasText() && dbo != null) {
        				e.textNodes().forEach((node) => {
        					if (!node.isBlank()) {
        						var text = node.text().trim().trimEnd();
        						var parsed = parseText(text);
        						parsed.forEach(item => {
        						  var value = item.value;
        						  var mode = item.type == ''text'' ? MobileSmartSourceType.Mode.PLAIN : MobileSmartSourceType.Mode.SCRIPT;
        						  var msst = new MobileSmartSourceType();
        						  msst.setMode(mode);
        						  msst.setSmartValue(value);
        						  var dbo_text = cm.createBean(cm.getComponentByName("UIText"));
        						  dbo_text.setTextSmartType(msst);
        						  dbo.add(dbo_text);
        						});						
        					}
        				});
        			}
        			if (e.childrenSize() > 0) {
        				e.children().forEach((child) => {
        					createBeans(child, dbo);
        				});
        			}
        			return dbo;
        		} catch (e) {
        			log.error("Failed to createBeans: "+ e.message);
        		}
        		return null;
        	}
        	
        	function getComponentFromMessages(Messages) {
        	const start = Date.now();
        	var scriptContent = `
        	/*Begin_c8o_CompImport*/
        	/*End_c8o_CompImport*/

          var hostUrl = "${assistant.lrag.host.url}";
          //var url = new URL("http://51.77.17.146:9621/query/stream");
          var url = new URL(hostUrl + "/query/stream");
          
          var conn = url.openConnection();
          conn.setRequestMethod("POST");
          conn.setRequestProperty("X-API-Key", apiKey);
          conn.setRequestProperty("Content-Type", "application/json");
          conn.setRequestProperty("Accept", "text/event-stream");
          conn.setDoOutput(true);
          
          // Enable streaming mode
          var payload = JSON.stringify({
            query: Question,
            user_prompt: Prompt,
            conversation_history: History ? JSON.parse(History) : [],
            response_type: "Multiple Paragraphs",
            mode: "mix",
            include_references: true,
            stream: true
          });
          
          
          var out = new java.io.OutputStreamWriter(conn.getOutputStream());
          out.write(payload);
          out.close();
          
          var error = "";
          var response = "";
          var refs = "";
          var references = ["null"];
          
          // Read streaming response
          var reader = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
          var line;
          
          while ((line = reader.readLine()) !== null) {
          	//log.warn("Received line: " + line); // Log the received line)
          	try {
          		var ob = JSON.parse(line);
          		if (ob) {
          			if (ob && ob.response) {
          				var text = ob.response;
          				response += text;
          				
          				var buffer = context.httpSession.getAttribute("C8OAiAssistantBuffer");
          				buffer.content += text;
          				buffer.size += buffer.content.length;
          				context.httpSession.setAttribute("C8OAiAssistantBuffer", buffer);
          			}
          			if (ob && ob.references) {
          				ob.references.forEach(reference => {
          					//log.warn("reference:"+JSON.stringify(reference));
          					references.push(reference.file_path);
          					refs += "- ["+ reference.reference_id +"] "+ reference.file_path + java.lang.System.lineSeparator();
          				});
          			}
          		}
          	} catch (e) {
          		error = e.message;
          		log.error("Error parsing JSON: " + "\nERROR" +  e.message + "\nLINE: " + line);
          	}
          	
          }
          
          reader.close();
          
          try {
          	context.httpSession.setAttribute("C8OAiAssistantBuffer", {"size" : 0, "content": ""});
          } catch (e) {}
          
          function normalizeMarkdownLinks(text) {
              return text.replace(
                  /\[([^\]]+)\]\s*(?:\(([^)]+)\)|(\S+))/g,
                  function (match, title, urlInParens, urlDirect) {
          
                      var url = urlInParens || urlDirect;
          
                      if (!/^https?:\/\//i.test(url) && /\.pdf$/i.test(url)) {
          				url = "https://convertigo-download.s3.us-east-1.amazonaws.com/webrepository/Documents%20Convertigo/" + url; 				
                      } else {
          				if (title === "Front End Basic training V1.pdf") {
          					url = "https://convertigo-download.s3.us-east-1.amazonaws.com/webrepository/Documents+Convertigo/Front+End+Basic+training+V1.pdf";
          				}
          				else if (title === "LowCodeStudio-BackEndTraining.pdf") {
          					url = "https://convertigo-download.s3.us-east-1.amazonaws.com/webrepository/Documents%20Convertigo/LowCodeStudio-BackEndTraining.pdf";
          				}
          			}
          
                      // reconstruire en conservant la syntaxe d''origine
                      if (urlInParens) {
                          return "[" + title + "](" + url + ")";
                      } else {
                          return "[" + title + "] " + url;
                      }
                  }
              );
          }
          
          var doc = context.outputDocument;
          if (error == "") {
          	var msg = normalizeMarkdownLinks(response);
          	//log.warn("Response done:"+ response);
          	if (msg.toLowerCase().indexOf("### références") == -1 && msg.toLowerCase().indexOf("### references") == -1) {
          		msg = msg + java.lang.System.lineSeparator() + "### Notes" + java.lang.System.lineSeparator() + normalizeMarkdownLinks(refs);
          	}
          	var el = doc.createElement("object");
          	doc.getDocumentElement().appendChild(el);
          	
          	var er = doc.createElement("response");
          	er.appendChild(doc.createTextNode(msg));
          	el.appendChild(er);
          } else {
          	var er = doc.createElement("error");
          	er.appendChild(doc.createTextNode(error));
          	doc.getDocumentElement().appendChild(er);	
          }'

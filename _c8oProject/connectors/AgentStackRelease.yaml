baseDir: /convertigo/c8oprj-lib-convertigo-assistant/refs/heads/master
comment: Fetches the published Tigo stack manifest through the Convertigo HTTP client and proxy settings.
https: true
port: 443
server: raw.githubusercontent.com
trustAllServerCertificates: false
↓GetManifest [transactions.JsonHttpTransaction]: 
  accessibility: Hidden
  comment: Returns only the reviewed stable Tigo stack. Legacy clients keep using stack-release.json, a stable alias.
  responseTimeout: 20
  subDir: /stack-release-stable.json
↓GetPreviewManifest [transactions.JsonHttpTransaction]: 
  accessibility: Hidden
  comment: Reviewed preview catalog, read with the stable one by the Pre-releases channel. That is the choice of a Studio, or of a whole server with the symbol assistant.stack.channel set to preview; the stable channel never reads it.
  responseTimeout: 20
  subDir: /stack-release-preview.json
        /*Begin_c8o_CompAfterViewInit*/
        		if (this.Files) {
        			let len = this.Files.length;
        			for (let i=0; i<len; i++) {
        				let f = this.Files[i];
        				if (f.name == this.file.filename) {
        					if (f.type.startsWith(''image/'')) {
        						const reader = new FileReader();
        						reader.onload = (e) => {
        						  this.imagePreview = e.target?.result;
        						};
        						reader.readAsDataURL(f);
        					} else {
        						this.imagePreview = ''./assets/attachment.png'';
        					}
        					break;
        				}
        			};
        		} else {
        		  this.imagePreview = null;
        		}
        		
        		try {
        			this.findPageOwner()["content"].scrollToBottom();
        		} catch (e) {}
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	/*End_c8o_CompFunction*/
        '

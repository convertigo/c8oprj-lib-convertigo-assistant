            height: 56px;
          
            img {
              border-radius: 10px;
              width: 100%;
              height: 100%;
              object-fit: cover;
            }
          
            .close-icon {
              position: absolute;
              top: -6px;
              right: -6px;
              background-color: white;
              border-radius: 50%;

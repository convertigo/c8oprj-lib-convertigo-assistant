    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        import { ViewChild, HostListener } from ''@angular/core'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	@ViewChild(''imageInput'', { static: false }) imageInput!: ElementRef;
        	@ViewChild(''attachInput'', { static: false }) attachInput!: ElementRef;
        	@ViewChild("btnReset", { static: false }) public btnReset;
        	disabled = false;
        	previews = {};
        	
        	multiple = false;
        	questionText: string = '''';
        	imageSrc: string | ArrayBuffer | null = null;
        	isDragging: boolean = false;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	refresh(timeout: number) {
        		setTimeout(() => {
        		  this.tick();//this.ref.detectChanges();
        		}, timeout);
        	}
        	
        	setEnable(enable) {
        		this.disabled = !enable;
        		this.refresh(0);
        	}
        	
        	onImageSelected(event: any) {
        	  this.addFiles(event.target.files, false);
        	}
        	
        	onAttachSelected(event: any) {
        		this.addFiles(event.target.files, false);
        	}
        	
        	addFiles(files, dragged) {
        		try {
        			if (dragged) {
        				this.addInputFiles(files);
        			}
        			
        			this.previews = {};
        			const dataTransfer = new DataTransfer();
        			for (let i=0; i< this.imageInput.nativeElement.files.length; i++) {
        				let f = this.imageInput.nativeElement.files[i];
        				dataTransfer.items.add(f);
        			}
        			for (let i=0; i< this.attachInput.nativeElement.files.length; i++) {
        				let f = this.attachInput.nativeElement.files[i];
        				dataTransfer.items.add(f);
        			}
        			this.Files = dataTransfer.files;
        			
        			console.log("this.Files",this.Files);
        			console.log("imageInput.files",this.imageInput.nativeElement.files);
        			console.log("attachInput.files",this.attachInput.nativeElement.files);
        			
        			this.sendMessage();
        			
        		} catch(e) {
        			console.error(e.message);
        			this.c8o.log.warn("addFiles failed: "+ e.message);
        		}
        	}	
        	
        	addInputFiles(files) {
        		if (files) {
        			const imageTransfer = new DataTransfer();
        			const attachTransfer = new DataTransfer();
        			
        			for (let i=0; i < files.length; i++) {
        				let file = files[i];
        				
        				if (this.imageInput.nativeElement.files.length > 0) {
        					for (let j=0; j< this.imageInput.nativeElement.files.length; j++) {
        						let f = this.imageInput.nativeElement.files[j];
        						if (f.name !== file.name) {
        							imageTransfer.items.add(f);
        						}
        					}
        				}
        				if (this.attachInput.nativeElement.files.length > 0) {
        					for (let j=0; j< this.attachInput.nativeElement.files.length; j++) {
        						let f = this.attachInput.nativeElement.files[j];
        						if (f.name !== file.name) {
        							attachTransfer.items.add(f);
        						}
        					}
        				}
        				if (file.type.startsWith(''image/'')) {
        					imageTransfer.items.add(file);
        				} else {
        					attachTransfer.items.add(file);
        				}
        			}
        			this.imageInput.nativeElement.files = imageTransfer.files;
        			this.attachInput.nativeElement.files = attachTransfer.files;
        		}
        	}
        	
        	sendMessage() {
        		let images = this.imageInput.nativeElement.files;
        		let attachments = this.attachInput.nativeElement.files;
        		console.log("this.Files",this.Files);
        		console.log("images",this.imageInput.nativeElement.files);
        		console.log("attachments",this.attachInput.nativeElement.files);
        		this.RunQuestion.emit({images: images, attachments: attachments});
        	}
        	
        	reset() {
        		this.btnReset.nativeElement.click();
        		
        		this.Files = null;
        		this.Question = '''';
        		this.previews = {};
        		this.local.AIFiles = [];
        	}
        	
        	@HostListener(''window:dragenter'', [''$event''])
        	onDragEnter(event: DragEvent) {
        	  this.isDragging = true;
        	}
        
        	@HostListener(''window:dragleave'', [''$event''])
        	onDragLeave(event: DragEvent) {
        	  this.isDragging = false;
        	}
        
        	@HostListener(''window:dragover'', [''$event''])
        	onDragOver(event: DragEvent) {
        	  event.preventDefault();
        	}
        
        	@HostListener(''window:drop'', [''$event''])
        	onDrop(event: DragEvent) {
        	  event.preventDefault();
        	  this.isDragging = false;
        	  if (event.dataTransfer && event.dataTransfer.files.length > 0) {
        	     this.addFiles(event.dataTransfer.files, true);
        	  }
        	}
        	/*End_c8o_CompFunction*/
        '
↓Fragment [ngx.components.UICustom-1752676065924]: 
  htmlTemplate: |
    <ion-card class="input-card" [disabled]="disabled">
      <ion-item lines="none">
    	<form>
        	<input type="file" hidden #imageInput accept="image/*" multiple (change)="onImageSelected($event)" />
    		<input type="file" hidden #attachInput (change)="onAttachSelected($event)" accept=".zip"/>
    		<button hidden type="reset" #btnReset ></button>
    	</form>
    	<ion-label>Drop here the ZIP file downloaded from AutoHTML plugin or select it using the 'staple' button</ion-label>
    	<ion-button fill="clear" (click)="attachInput.click()" title="Ajouter un zip">
    	  <ion-icon name="attach-outline"></ion-icon>
    	</ion-button>
      </ion-item>
    </ion-card>
    <div class="drag-overlay" *ngIf="isDragging">Drop your ZIP file here...</div>

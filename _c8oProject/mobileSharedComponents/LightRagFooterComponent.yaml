        →: |
          ':host {
            display: block;
          }
          
          :host-context(ion-footer.modern-footer) ion-toolbar,
          :host-context(.modern-footer) ion-toolbar {
            --background: var(--modern-surface-soft);
            --color: var(--modern-muted);
          }
          
          .modern-suggestions-label,
          .modern-meta-row p {
            margin: 0;
          }
          
          .modern-suggestions-toolbar {
            border-top: 1px solid var(--modern-border);
            --min-height: 79px;
            padding: 0;
          }
          
          .modern-suggestions-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 13px 16px 12px;
          }
          
          .modern-suggestions-label {
            color: var(--modern-muted);
            font-size: 12px;
            line-height: 16px;
          }
          
          .modern-suggestions-row {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
          }
          
          .modern-suggestions-row::-webkit-scrollbar {
            display: none;
          }
          
          .modern-suggestion-btn {
            --color: var(--modern-text);
            --border-color: var(--modern-border);
            --background: var(--modern-surface);
            --border-radius: 10px;
            --padding-top: 0;
            --padding-bottom: 0;
            --padding-start: 11px;
            --padding-end: 11px;
            --box-shadow: none;
            min-height: 30px;
            height: 30px;
            text-transform: none;
            font-size: 12px;
            font-weight: 500;
            margin: 0;
            flex: 0 0 auto;
            //min-width: 196px;
            width: max-content;
            max-width: none;
          }
          
          .modern-suggestion-btn::part(native) {
            border-radius: 10px;
            border: 1px solid var(--modern-border);
            background: var(--modern-surface);
            color: var(--modern-text);
            box-shadow: none;
            padding: 1px 13px;
            gap: 6px;
            line-height: 16px;
            white-space: nowrap;
            width: max-content;
            max-width: none;
            overflow: visible;
            text-overflow: clip;
          }
          
          .modern-suggestion-icon {
            font-size: 14px;
            color: var(--modern-muted);
          }
          
          .modern-input-toolbar {
            border-top: 1px solid var(--modern-border);
            padding: 0;
          }
          
          .modern-input-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 24px 0;
            flex: 0 0 auto;
          }
          
          .modern-hidden-file-inputs {
            display: none;
          }
          
          .modern-selected-assets {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--modern-border);
            background: var(--modern-input-bg);
          }
          
          .modern-selected-images {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
          }
          
          .modern-selected-images::-webkit-scrollbar {
            display: none;
          }
          
          .modern-selected-image {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 70px;
            flex: 0 0 auto;
            position: relative;
          }
          
          .modern-selected-image-thumb {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            border: 1px solid var(--modern-border);
            object-fit: cover;
            background: var(--modern-surface);
          }
          
          .modern-selected-image-name {
            margin: 0;
            font-size: 11px;
            line-height: 14px;
            color: var(--modern-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          
          .modern-selected-remove-btn {
            --padding-start: 0;
            --padding-end: 0;
            --color: var(--modern-muted);
            width: 20px;
            height: 20px;
            min-height: 20px;
            margin: 0;
            position: absolute;
            top: -6px;
            right: -6px;
            z-index: 2;
          }
          
          .modern-selected-remove-btn::part(native) {
            width: 20px;
            height: 20px;
            min-height: 20px;
            padding: 0;
            border-radius: 999px;
            border: 1px solid var(--modern-border);
            background: var(--modern-surface);
          }
          
          .modern-selected-remove-btn ion-icon {
            font-size: 12px;
            color: var(--modern-muted);
          }
          
          .modern-selected-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
          }
          
          .modern-selected-attachment {
            display: inline-flex;
            align-items: center;
            gap: 6px;

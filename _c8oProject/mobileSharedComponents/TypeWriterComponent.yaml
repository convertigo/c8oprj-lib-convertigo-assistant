        private restartTyping(): void {
            this.clearTypingInterval();
            this.currentIndex = 0;
            this.scrollOffset = 0;
            this.updateScrollPosition(0);
            this.displayedText = this.fullText.length > this.maxLength ? this.fullText.substring(0, this.maxLength) : this.fullText;
        
        	//console.log("restartTyping fullText", this.fullText)
        	//console.log("restartTyping displayedText", this.displayedText)
        	//console.log("restartTyping newText", this.newText)
        	
            if (this.newText.length === 0) {
              // No new text to type, just show existing text
              return;
            }
        
            this.intervalId = setInterval(() => {
              if (this.currentIndex < this.newText.length) {
                this.displayedText += this.newText.charAt(this.currentIndex);
                this.currentIndex++;
        
                if (this.displayedText.length > this.maxLength) {
                  this.scrollOffset += this.getCharWidth();
                  this.updateScrollPosition(this.scrollOffset);
                  this.displayedText = this.displayedText.substring(1);
                }
              } else {
                this.clearTypingInterval();
                // After typing new text, append it to fullText
                this.fullText += this.newText;
                this.newText = '''';
              }
        	  this.tick();
            }, this.speed);
          }
        private getCharWidth(): number {
            if (!this.scrollTextRef || this.displayedText.length === 0) {
              return 10; // fallback width
            }
            const span = this.scrollTextRef.nativeElement;
            return span.offsetWidth / this.displayedText.length || 10;
          }
        private updateScrollPosition(offset: number): void {
            if (this.scrollTextRef) {
              this.scrollTextRef.nativeElement.style.transform = `translateX(-${offset}px)`;
            }
          }
        private clearTypingInterval(): void {
            if (this.intervalId !== null) {
              clearInterval(this.intervalId);
              this.intervalId = null;
            }
          }
        onRestartClick(): void {
            this.restartTyping();
          }
        /*End_c8o_CompFunction*/

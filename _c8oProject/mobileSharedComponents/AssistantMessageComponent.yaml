        →: |
          '.chat-assistant-message {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            width: 100%;
          }
          .chat-assistant-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            //background: linear-gradient(180deg, var(--modern-cyan, #06b6d4), var(--modern-teal, #14b8a6));
            //box-shadow: 0 4px 6px rgba(6, 182, 212, 0.2), 0 2px 4px rgba(6, 182, 212, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
          }
          .chat-assistant-avatar-icon {
            color: var(--modern-text, #f1f5f9);
            font-size: 16px;
          }
          .chat-assistant-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(100%, 768px);
          }
          .chat-message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 16px;
          }
          .chat-message-author {
            margin: 0;
            color: var(--modern-muted, #94a3b8);
            font-size: 12px;
            line-height: 16px;
          }
          .chat-message-time {
            margin: 0;
            color: var(--modern-muted-soft, rgba(148, 163, 184, 0.6));
            font-size: 12px;
            line-height: 16px;
          }
          .chat-assistant-bubble {
            margin: 0;
            border-radius: 16px;
            border: 1px solid var(--modern-border, #1e293b);
            background: var(--modern-surface, #0f172a);
            box-shadow: none;
          }
          .chat-assistant-bubble ion-card-content {
            padding: 15px 21px 12px;
          }
          .chat-assistant-image {
            display: block;
            width: 100%;
            max-width: 480px;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.65);
          }
          .chat-message-text {
            margin: 0;
            color: var(--modern-text, #f1f5f9);
            font-size: 16px;
            line-height: 26px;
            letter-spacing: -0.3125px;
          }
          .chat-assistant-bubble markdown,
          .chat-assistant-bubble markdown p,
          .chat-assistant-bubble markdown li {
            color: var(--modern-text, #f1f5f9);
            font-size: 16px;
            line-height: 26px;
            letter-spacing: -0.3125px;
          }
          .chat-assistant-bubble markdown p {
            margin: 0 0 8px;
          }
          .chat-assistant-bubble markdown p:last-child {
            margin-bottom: 0;
          }
          .chat-raw-stream-wrap {
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            border: 1px dashed color-mix(in srgb, var(--modern-cyan, #06b6d4) 34%, var(--modern-border, #1e293b) 66%);
            background: color-mix(in srgb, var(--modern-cyan, #06b6d4) 10%, var(--modern-surface, #0f172a) 90%);
            padding: 6px 0;
            margin: 2px 0 4px;
          }
          .chat-raw-stream-line {
            margin: 0;
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            color: color-mix(in srgb, var(--modern-cyan, #06b6d4) 54%, var(--modern-text, #f1f5f9) 46%);
            font-size: 12px;
            line-height: 18px;
            letter-spacing: 0.2px;
            animation: chat-raw-stream-marquee 10s linear infinite;
          }
          @keyframes chat-raw-stream-marquee {
            0% {
              transform: translateX(0);
            }
            100% {
              transform: translateX(-100%);
            }
          }
          .chat-writing-state {
            margin: 8px 0 0;
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            color: color-mix(in srgb, var(--modern-cyan, #06b6d4) 58%, var(--modern-text, #f1f5f9) 42%);
            background: color-mix(in srgb, var(--modern-cyan, #06b6d4) 12%, var(--modern-surface, #0f172a) 88%);
            //border: 1px solid rgba(6, 182, 212, 0.32);
            //box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.06), 0 0 12px rgba(6, 182, 212, 0.2);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.1px;

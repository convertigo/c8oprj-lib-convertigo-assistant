        →: |
          '.chat-assistant-message {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            width: 100%;
          }
          .chat-assistant-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            //background: linear-gradient(180deg, var(--modern-cyan, #06b6d4), var(--modern-teal, #14b8a6));
            //box-shadow: 0 4px 6px rgba(6, 182, 212, 0.2), 0 2px 4px rgba(6, 182, 212, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
          }
          .chat-assistant-avatar-icon {
            color: var(--modern-text, #f1f5f9);
            font-size: 16px;
          }
          .chat-assistant-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(100%, 768px);
          }
          .chat-message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 16px;
          }
          .chat-message-author {
            margin: 0;
            color: var(--modern-muted, #94a3b8);
            font-size: 12px;
            line-height: 16px;
          }
          .chat-message-time {
            margin: 0;
            color: var(--modern-muted-soft, rgba(148, 163, 184, 0.6));
            font-size: 12px;
            line-height: 16px;
          }
          .chat-assistant-bubble {
            margin: 0;
            border-radius: 16px;
            border: 1px solid var(--modern-border, #1e293b);
            background: var(--modern-surface, #0f172a);
            box-shadow: none;
          }
          .chat-assistant-bubble ion-card-content {
            padding: 15px 21px 12px;
          }
          .chat-message-text {
            margin: 0;
            color: var(--modern-text, #f1f5f9);
            font-size: 16px;
            line-height: 26px;
            letter-spacing: -0.3125px;
          }
          .chat-assistant-bubble markdown,
          .chat-assistant-bubble markdown p,
          .chat-assistant-bubble markdown li {
            color: var(--modern-text, #f1f5f9);
            font-size: 16px;
            line-height: 26px;
            letter-spacing: -0.3125px;
          }
          .chat-assistant-bubble markdown p {
            margin: 0 0 8px;
          }
          .chat-assistant-bubble markdown p:last-child {
            margin-bottom: 0;
          }
          .chat-writing-state {
            margin: 8px 0 0;
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            color: var(--modern-cyan, #06b6d4);
            background: rgba(6, 182, 212, 0.12);
            //border: 1px solid rgba(6, 182, 212, 0.32);
            //box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.06), 0 0 12px rgba(6, 182, 212, 0.2);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.1px;
            animation: chat-writing-glow 1.6s ease-in-out infinite;
          }
          @keyframes chat-writing-glow {
            0%, 100% {
              box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.06), 0 0 8px rgba(6, 182, 212, 0.14);
            }
            50% {
              box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.1), 0 0 16px rgba(6, 182, 212, 0.26);
            }
          }
          .chat-assistant-tags {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding-top: 9px;
            border-top: 1px solid rgba(30, 41, 59, 0.4);
          }
          .chat-assistant-tag {
            margin: 0;
            color: var(--modern-muted, #94a3b8);
            font-size: 12px;
            line-height: 16px;
          }
          @media (max-width: 768px) {
            .chat-assistant-message {
              gap: 12px;
            }
            .chat-assistant-body {
              width: 100%;
            }
          }
          '
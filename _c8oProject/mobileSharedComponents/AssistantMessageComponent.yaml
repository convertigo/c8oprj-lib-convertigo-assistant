        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	releasePreviewUrl() {
        		try {
        			if (this.previewUrl && this.previewUrl.indexOf("blob:") === 0 && window && window.URL && window.URL.revokeObjectURL) {
        				window.URL.revokeObjectURL(this.previewUrl);
        			}
        		} catch (e) {}
        		this.previewUrl = "";
        		this.previewFile = null;
        	}
        	
        	looksLikeImageName(name) {
        		var value = "" + (name == null ? "" : name);
        		value = value.toLowerCase();
        		var exts = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".svg", ".heic", ".heif", ".avif"];
        		for (var i = 0; i < exts.length; i++) {
        			var ext = exts[i];
        			if (value.length >= ext.length && value.lastIndexOf(ext) === value.length - ext.length) {
        				return true;
        			}
        		}
        		return false;
        	}
        	
        	findImageFileByName(name) {
        		var target = "" + (name == null ? "" : name);
        		if (!target.length) {
        			return null;
        		}
        		var files = this.files;
        		try {
        			if (!files || files.length == null) {
        				return null;
        			}
        			for (var i = 0; i < files.length; i++) {
        				var current = files[i];
        				if (!current) {
        					continue;
        				}
        				if (("" + (current.name == null ? "" : current.name)) === target) {
        					return current;
        				}
        			}
        		} catch (e) {}
        		return null;
        	}
        	
        	getImageSource() {
        		var value = this.file;
        		if (!value) {
        			return "";
        		}
        		if (typeof value === "string") {
        			return value;
        		}
        		try {
        			if (value.url != null && ("" + value.url).length) {
        				return "" + value.url;
        			}
        			if (value.src != null && ("" + value.src).length) {
        				return "" + value.src;
        			}
        			if (value.imageUrl != null && ("" + value.imageUrl).length) {
        				return "" + value.imageUrl;
        			}
        			if (value.preview != null && ("" + value.preview).length) {
        				return "" + value.preview;
        			}
        		} catch (e1) {}
        		
        		var candidate = value;
        		try {
        			if (candidate && candidate.file) {
        				candidate = candidate.file;
        			}
        		} catch (e2) {}
        		
        		try {
        			var fileName = "";
        			if (value && value.filename != null) {
        				fileName = "" + value.filename;
        			} else if (candidate && candidate.filename != null) {
        				fileName = "" + candidate.filename;
        			}
        			if (fileName.length) {
        				var matched = this.findImageFileByName(fileName);
        				if (matched) {
        					candidate = matched;
        				}
        			}
        		} catch (e22) {}
        		
        		try {
        			if (candidate && typeof Blob !== "undefined" && candidate instanceof Blob && window && window.URL && window.URL.createObjectURL) {
        				if (this.previewFile !== candidate || !this.previewUrl.length) {
        					this.releasePreviewUrl();
        					this.previewFile = candidate;
        					this.previewUrl = window.URL.createObjectURL(candidate);
        				}
        				return this.previewUrl;
        			}
        		} catch (e3) {}
        		
        		return "";
        	}
        	
        	hasImageContent() {
        		return this.getImageSource().length > 0;
        	}
        	
        	getImageAlt() {
        		var value = this.file;
        		try {
        			if (value && value.file) {
        				value = value.file;
        			}
        		} catch (e1) {}
        		try {
        			var name = "";
        			if (value && value.name != null) {
        				name = "" + value.name;
        			} else if (value && value.filename != null) {
        				name = "" + value.filename;
        			}
        			if (name.length) {
        				return name;
        			}
        		} catch (e2) {}
        		return "image";
        	}
        	
        	hasTextMessage() {
        		var text = "" + (this.message == null ? "" : this.message);
        		return text.trim().length > 0;
        	}
        	
        	isRawStreamTickerActive() {
        		return this.rawStreamTicker === true && this.writing === true;
        	}
        	
        	getRawStreamTickerText() {
        		var text = "" + (this.message == null ? "" : this.message);
        		text = text.replace(/\s+/g, " ").trim();
        		if (!text.length) {
        			text = "" + (this.status == null ? "" : this.status);
        			text = text.trim();
        		}
        		if (!text.length) {
        			text = "streaming...";
        		}
        		if (text.length > 220) {
        			text = text.substring(text.length - 220);
        		}
        		return text + "   |   " + text;
        	}
        	/*End_c8o_CompFunction*/

        	base64ToFile(base64String: string, name: string, type: string) {
        	  const byteString = atob(base64String.split('','')[1]); // supprime le préfixe data:...base64,
        	  const ab = new ArrayBuffer(byteString.length);
        	  const ia = new Uint8Array(ab);
        
        	  for (let i = 0; i < byteString.length; i++) {
        	    ia[i] = byteString.charCodeAt(i);
        	  }
        
        	  return new File([ab], name, { type: type });
        	}
        	
        	setImage(base64String: string, name: string, type: string) {
        		try {
        			const file = this.base64ToFile(base64String, name, type);
        			const files = [];
        			files.push(file);
        			this.addFiles(files, true);
        			this.refresh(200);
        		} catch (e) {
        			this.c8o.log.warn("setImage failed: "+ e.message);
        		}
        	}
        	
        	refresh(timeout: number) {
        		setTimeout(() => {
        		  this.tick();//this.ref.detectChanges();
        		}, timeout);
        	}
        	
        	setEnable(enable) {
        		this.disabled = !enable;
        		this.refresh(0);
        		//this.c8o.log.warn("disabled:"+ this.disabled);
        	}
        	
        	onImageSelected(event: any) {
        	  this.addFiles(event.target.files, false);
        	}
        	
        	onAttachSelected(event: any) {
        		this.addFiles(event.target.files, false);
        	}
        	
        	addFiles(files, dragged) {
        		try {
        			if (dragged) {
        				this.addInputFiles(files);
        			}
        			
        			this.previews = {};
        			const dataTransfer = new DataTransfer();
        			for (let i=0; i< this.imageInput.nativeElement.files.length; i++) {
        				let f = this.imageInput.nativeElement.files[i];
        				dataTransfer.items.add(f);
        				this.previewImage(f);
        			}
        			for (let i=0; i< this.attachInput.nativeElement.files.length; i++) {
        				let f = this.attachInput.nativeElement.files[i];
        				dataTransfer.items.add(f);
        				this.previewImage(f);
        			}
        			this.Files = dataTransfer.files;
        			
        			console.log("this.Files",this.Files);
        			console.log("imageInput.files",this.imageInput.nativeElement.files);
        			console.log("attachInput.files",this.attachInput.nativeElement.files);
        			
        		} catch(e) {
        			console.log(e.message);
        		}
        	}	
        	
        	addInputFiles(files) {
        		if (files) {
        			console.log("dragged files start", files);
        			const imageTransfer = new DataTransfer();
        			const attachTransfer = new DataTransfer();
        			
        			for (let i=0; i < files.length; i++) {
        				let file = files[i];
        				
        				if (this.imageInput.nativeElement.files.length > 0) {
        					for (let j=0; j< this.imageInput.nativeElement.files.length; j++) {
        						let f = this.imageInput.nativeElement.files[j];
        						if (f.name !== file.name) {
        							imageTransfer.items.add(f);
        						}
        					}
        				}
        				if (this.attachInput.nativeElement.files.length > 0) {
        					for (let j=0; j< this.attachInput.nativeElement.files.length; j++) {
        						let f = this.attachInput.nativeElement.files[j];
        						if (f.name !== file.name) {
        							attachTransfer.items.add(f);
        						}
        					}
        				}
        				if (file.type.startsWith(''image/'')) {
        					imageTransfer.items.add(file);
        				} else {
        					attachTransfer.items.add(file);
        				}
        			}
        			this.imageInput.nativeElement.files = imageTransfer.files;
        			this.attachInput.nativeElement.files = attachTransfer.files;
        		}
        	}
        	
        	removeFile(filename) {
        		try {
        			//this.c8o.log.warn(''removeFile: ''+ filename);
        			if (this.Files.length > 0) {
        				const dataTransfer = new DataTransfer();
        				
        				const imageTransfer = new DataTransfer();
        				for (let i=0; i< this.imageInput.nativeElement.files.length; i++) {
        					let file = this.imageInput.nativeElement.files[i];
        					if (file.name !== filename) {
        						imageTransfer.items.add(file);
        						dataTransfer.items.add(file);
        					}
        				}
        				this.imageInput.nativeElement.files = imageTransfer.files;
        				
        				const attachTransfer = new DataTransfer();
        				for (let i=0; i< this.attachInput.nativeElement.files.length; i++) {
        					let file = this.attachInput.nativeElement.files[i];
        					if (file.name !== filename) {
        						attachTransfer.items.add(file);
        						dataTransfer.items.add(file);
        					}
        				}
        				this.attachInput.nativeElement.files = attachTransfer.files;
        				
        				this.Files = dataTransfer.files;
        				
        				this.refresh(0);
        				
        				console.log("this.Files",this.Files);
        				console.log("imageInput.files",this.imageInput.nativeElement.files);
        				console.log("attachInput.files",this.attachInput.nativeElement.files);
        			}
        		} catch (e) {
        			console.log(e.message);
        		}
        	}
        	
        	previewImage(f) {
        		if (f.type.startsWith(''image/'')) {
        			const reader = new FileReader();
        			reader.onload = (e) => {
        			  this.previews[f.name] = e.target?.result;
        			};
        			reader.readAsDataURL(f);
        		} else {
        			this.previews[f.name] = ''./assets/attachment.png'';
        		}
        	}
        
        	onKeyEnter(event: KeyboardEvent): void {
        	    if (event.key === ''Enter'' && event.ctrlKey) {
        	      	event.preventDefault();
        	      	this.sendMessage();
        	    }
        	}
        
        	sendMessage() {
        		let images = this.imageInput.nativeElement.files;
        		let attachments = this.attachInput.nativeElement.files;
        		console.log("this.Files",this.Files);
        		console.log("images",this.imageInput.nativeElement.files);
        		console.log("attachments",this.attachInput.nativeElement.files);
        		this.RunQuestion.emit({images: images, attachments: attachments});
        	}
        	
        	requestCapture() {
        		this.RequestCapture.emit({});
        	}
        	
        	reset() {
        		try {
        			//console.log("imageReset", this.btnReset.nativeElement);
        			this.btnReset.nativeElement.click();
        			console.log("btnReset clicked");
        		} catch(e) {
        			console.log("error", e);
        		}
        		
        		this.Files = null;
        		this.Question = '''';
        		this.previews = {};
        		this.local.AIFiles = [];
        		console.log("chatinput reset");
        	}
        	
        	startSpeechRecognition() {
        	  const SpeechRecognition = (window as any).webkitSpeechRecognition || (window as any).SpeechRecognition;
        	  if (!SpeechRecognition) {
        	    alert("La reconnaissance vocale n''est pas prise en charge par ce navigateur.");
        	    return;
        	  }
        
        	  const recognition = new SpeechRecognition();
        	  recognition.lang = ''fr-FR'';
        	  recognition.interimResults = false;
        	  recognition.maxAlternatives = 1;
        
        	  recognition.onresult = (event: any) => {
        	    const transcript = event.results[0][0].transcript;
        	    this.questionText += (this.questionText ? '' '' : '''') + transcript;
        	  };
        
        	  recognition.onerror = (event: any) => {
        	    console.error(''Erreur de reconnaissance vocale:'', event.error);
        	  };
        
        	  recognition.start();
        	}
        
        	@HostListener(''window:dragenter'', [''$event''])
        	onDragEnter(event: DragEvent) {
        	  this.isDragging = true;
        	}
        
        	@HostListener(''window:dragleave'', [''$event''])
        	onDragLeave(event: DragEvent) {
        	  this.isDragging = false;
        	}
        
        	@HostListener(''window:dragover'', [''$event''])
        	onDragOver(event: DragEvent) {
        	  event.preventDefault();
        	}
        
        	@HostListener(''window:drop'', [''$event''])
        	onDrop(event: DragEvent) {
        	  event.preventDefault();
        	  this.isDragging = false;
        	  if (event.dataTransfer && event.dataTransfer.files.length > 0) {
        	     this.addFiles(event.dataTransfer.files, true);
        	  }
        	}
        	/*End_c8o_CompFunction*/
        '

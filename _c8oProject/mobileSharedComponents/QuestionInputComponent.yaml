  htmlTemplate: |
    <ion-card class="input-card" [disabled]="disabled">
      <ion-item lines="none">
    	<ng-container *ngIf="Files && Files.length > 0">
    		<ng-container *ngFor="let file of Files; index as i">
    			<ion-thumbnail slot="start" class="image-preview" *ngIf="previews[file.name]">
    			  <img [src]="previews[file.name]" alt="aperçu" />
    			  <ion-icon name="close-circle" class="close-icon" (click)="removeFile(file.name)"></ion-icon>
    			</ion-thumbnail>
    		</ng-container>
    	</ng-container>
        <ion-textarea 
    		class="chat-text-input"
    		aria-label="question input"
    		placeholder="Poser une question (multi-lignes) et Ctrl+Enter"
    		[autoGrow]="true"
    		[(ngModel)]="this.Question"
    		(keydown)="this.onKeyEnter($event)"
    	></ion-textarea>
    
    	<form>
        	<input type="file" hidden #imageInput accept="image/*" multiple (change)="onImageSelected($event)" />
    		<input type="file" hidden #attachInput multiple (change)="onAttachSelected($event)" />
    		<button hidden type="reset" #btnReset ></button>
    	</form>
    	
    	<ion-button fill="clear" (click)="reset()" title="Effacer">
    		<ion-icon name="close-outline"></ion-icon>
    	</ion-button>
        <ion-button fill="clear" (click)="startSpeechRecognition()" title="Dicter">
          <ion-icon name="mic-outline"></ion-icon>
        </ion-button>
    
        <ion-button fill="solid" (click)="sendMessage()" title="Soumettre">
          <ion-icon name="arrow-up-outline"></ion-icon>
        </ion-button>
      </ion-item>
    
      <ion-item lines="none" class="tools-bar">
    	<ion-button fill="clear" (click)="requestCapture()" title="Prendre une image">
    	  <ion-icon name="camera-outline"></ion-icon>
    	</ion-button>
        <ion-button fill="clear" (click)="imageInput.click()" title="Ajouter une image">
          <ion-icon name="image-outline"></ion-icon>
        </ion-button>
    	<ion-button fill="clear" (click)="attachInput.click()" title="Ajouter un attachement">
    	  <ion-icon name="attach-outline"></ion-icon>
    	</ion-button>

        →: |
          ':host {
            display: block;
            --figma-drop-border: var(--modern-border, #1e293b);
            --figma-drop-bg: var(--modern-surface, #0f172a);
            --figma-drop-bg-dragging: color-mix(in srgb, var(--modern-cyan, #06b6d4) 10%, var(--modern-surface, #0f172a) 90%);
            --figma-drop-hover-border: color-mix(in srgb, var(--modern-cyan, #06b6d4) 45%, var(--modern-border, #1e293b) 55%);
          }
          
          .figma-footer-toolbar {
            --background: var(--modern-surface-soft, rgba(15, 23, 42, 0.5));
            --color: var(--modern-muted, #94a3b8);
            --padding-start: 0;
            --padding-end: 0;
            --min-height: auto;
            padding: 0;
            border-top: 1px solid var(--modern-border, #1e293b);
          }
          
          .figma-drop-button {
            width: 100%;
            margin: 0;
            --padding-start: 0;
            --padding-end: 0;
            --padding-top: 0;
            --padding-bottom: 0;
            --background: transparent;
            --background-hover: transparent;
            --background-activated: transparent;
            --background-focused: transparent;
            --box-shadow: none;
            --border-radius: 16px;
            text-transform: none;
            color: var(--modern-text, #f1f5f9);
          }
          
          .figma-drop-button::part(native) {
            width: 100%;
            min-height: 123px;
            padding: 2px;
            border-radius: 16px;
            border: 2px dashed var(--figma-drop-border);
            background: var(--figma-drop-bg);
            box-shadow: none;
            justify-content: center;
            align-items: center;
          }
          .figma-drop-button:hover::part(native),
          .figma-drop-button:focus-visible::part(native) {
            border-color: var(--figma-drop-hover-border);
          }
          
          .figma-drop-button.figma-drop-button-dragging::part(native) {
            border-color: var(--modern-cyan, #06b6d4);
            background: var(--figma-drop-bg-dragging);
          }
          
          .figma-drop-content {
            width: 100%;
            min-height: 119px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 16px;
          }
          
          .figma-drop-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(20, 184, 166, 0.1) 100%);
            border: 1px solid color-mix(in srgb, var(--modern-cyan, #06b6d4) 25%, var(--modern-border, #1e293b) 75%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
          }
          
          .figma-drop-icon {
            color: var(--modern-cyan, #06b6d4);
            font-size: 28px;
          }
          
          .figma-drop-text-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            max-width: 320px;
            min-width: 0;
            text-align: left;
          }
          
          .figma-drop-title,
          .figma-drop-subtitle,
          .figma-drop-hint {
            margin: 0;
          }
          
          .figma-drop-title {
            color: var(--modern-text, #f1f5f9);
            font-size: 18px;
            font-weight: 500;
            line-height: 27px;
            letter-spacing: -0.4395px;
          }
          
          .figma-drop-subtitle {
            color: var(--modern-muted, #94a3b8);
            font-size: 14px;
            line-height: 20px;
            letter-spacing: -0.1504px;
          }
          
          .figma-drop-hint {
            color: var(--modern-muted, #94a3b8);
            font-size: 12px;
            line-height: 16px;
          }
          
          .figma-hidden-inputs {
            display: none;
          }
          
          @media (max-width: 768px) {
            .figma-drop-button::part(native) {
              min-height: 108px;
            }
          
            .figma-drop-content {
              min-height: 104px;
              gap: 12px;
              padding: 0 10px;
            }
          
            .figma-drop-icon-wrap {
              width: 48px;
              height: 48px;
              border-radius: 12px;
            }
          
            .figma-drop-icon {
              font-size: 24px;
            }
          
            .figma-drop-title {
              font-size: 16px;
              line-height: 22px;
            }
          
            .figma-drop-subtitle {
              font-size: 13px;
              line-height: 18px;
            }
          
            .figma-drop-hint {
              font-size: 11px;
              line-height: 14px;
            }
          }'

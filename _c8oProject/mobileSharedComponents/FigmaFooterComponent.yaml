        '/*Begin_c8o_CompImport*/
        import { HostListener } from ''@angular/core'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	disabled = false;
        	isDragging = false;
        	attachInputEl = null;
        	attachInputChangeHandler = null;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		this.unbindAttachInputChange();
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		this.bindAttachInputChange(80);
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	refresh(timeout) {
        		var wait = timeout == null ? 0 : timeout;
        		var self = this;
        		setTimeout(function() {
        			try {
        				self.tick();
        			} catch (e) {}
        		}, wait);
        	}
        	
        	setEnable(enable) {
        		this.disabled = !enable;
        		this.refresh(0);
        	}
        	
        	isComponentEnabled() {
        		return this.disabled !== true && this.EnableChat !== false && this.IsProcessing !== true;
        	}
        	
        	getAttachInputElement() {
        		try {
        			if (this.attachInput && this.attachInput.nativeElement) {
        				return this.attachInput.nativeElement;
        			}
        		} catch (e) {}
        		return null;
        	}
        	
        	bindAttachInputChange(delay) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				self.unbindAttachInputChange();
        				var inputEl = self.getAttachInputElement();
        				if (!inputEl || !inputEl.addEventListener) {
        					return;
        				}
        				var handler = function(ev) {
        					self.onAttachSelected(ev);
        				};
        				inputEl.addEventListener(''change'', handler);
        				self.attachInputEl = inputEl;
        				self.attachInputChangeHandler = handler;
        			} catch (e) {}
        		}, wait);
        	}
        	
        	unbindAttachInputChange() {
        		try {
        			if (this.attachInputEl && this.attachInputChangeHandler && this.attachInputEl.removeEventListener) {
        				this.attachInputEl.removeEventListener(''change'', this.attachInputChangeHandler);
        			}
        		} catch (e) {}
        		this.attachInputEl = null;
        		this.attachInputChangeHandler = null;
        	}
        	
        	isZipFile(file) {
        		if (!file) {
        			return false;
        		}
        		var name = '''' + (file.name == null ? '''' : file.name);
        		var type = '''' + (file.type == null ? '''' : file.type);
        		name = name.toLowerCase();
        		type = type.toLowerCase();
        		return name.lastIndexOf(''.zip'') === name.length - 4 || type.indexOf(''zip'') !== -1;
        	}
        	
        	openAttachPicker(event) {
        		try {
        			if (event && event.preventDefault) {
        				event.preventDefault();
        			}
        			if (event && event.stopPropagation) {
        				event.stopPropagation();
        			}
        			if (!this.isComponentEnabled()) {
        				return;
        			}
        			var input = this.getAttachInputElement();
        			if (input && input.click) {
        				input.click();
        			}
        		} catch (e) {}
        	}
        	
        	onAttachSelected(event) {
        		var files = event && event.target ? event.target.files : null;
        		this.addFiles(files, false);
        	}
        	
        	addInputFiles(files) {
        		try {
        			if (!files || files.length == null || files.length === 0) {
        				return;
        			}
        			var input = this.getAttachInputElement();
        			if (!input) {
        				return;
        			}
        			
        			var byName = {};
        			var current = input.files;
        			var i = 0;
        			
        			if (current && current.length != null) {
        				for (i = 0; i < current.length; i++) {
        					if (this.isZipFile(current[i])) {
        						byName['''' + current[i].name] = current[i];
        					}
        				}
        			}
        			
        			for (i = 0; i < files.length; i++) {
        				if (this.isZipFile(files[i])) {
        					byName['''' + files[i].name] = files[i];
        				}
        			}
        			
        			var dt = new DataTransfer();
        			for (var name in byName) {
        				if (!byName.hasOwnProperty(name)) {
        					continue;
        				}
        				dt.items.add(byName[name]);
        			}
        			input.files = dt.files;
        		} catch (e) {}
        	}
        	
        	addFiles(files, dropped) {
        		try {
        			if (!this.isComponentEnabled()) {
        				return;
        			}
        			
        			if (dropped) {
        				this.addInputFiles(files);
        			}
        			
        			var input = this.getAttachInputElement();
        			var attachments = input && input.files != null ? input.files : files;
        			if (!attachments || attachments.length == null || attachments.length === 0) {
        				return;
        			}
        			
        			this.Files = attachments;
        			this.sendMessage();
        		} catch (e) {
        			try {
        				this.c8o.log.warn(''FigmaFooterComponent addFiles failed: '' + e.message);
        			} catch (e2) {}
        		}
        	}
        	
        	sendMessage() {
        		try {
        			var input = this.getAttachInputElement();
        			var attachments = input && input.files != null ? input.files : this.Files;
        			if (!attachments || attachments.length == null || attachments.length === 0) {
        				return;
        			}
        			this.RunQuestion.emit({
        				question: '''',
        				images: [],
        				attachments: attachments
        			});
        		} catch (e) {}
        	}
        	
        	reset() {
        		try {
        			var input = this.getAttachInputElement();
        			if (input) {
        				var dt = new DataTransfer();
        				input.files = dt.files;
        				input.value = '''';
        			}
        		} catch (e) {
        			try {
        				var fallback = this.getAttachInputElement();
        				if (fallback) {
        					fallback.value = '''';
        				}
        			} catch (e2) {}
        		}
        		
        		this.Files = null;
        		this.Question = '''';
        		this.isDragging = false;
        		this.refresh(0);
        	}
        	
        	@HostListener(''window:dragenter'', [''$event''])
        	onDragEnter(event) {
        		if (!this.isComponentEnabled()) {
        			return;
        		}
        		this.isDragging = true;
        	}
        	
        	@HostListener(''window:dragleave'', [''$event''])
        	onDragLeave(event) {
        		if (!this.isComponentEnabled()) {
        			return;
        		}
        		this.isDragging = false;
        	}
        	
        	@HostListener(''window:dragover'', [''$event''])
        	onDragOver(event) {
        		if (!this.isComponentEnabled()) {
        			return;
        		}
        		if (event && event.preventDefault) {
        			event.preventDefault();
        		}
        	}
        	
        	@HostListener(''window:drop'', [''$event''])
        	onDrop(event) {
        		if (!this.isComponentEnabled()) {
        			return;
        		}
        		if (event && event.preventDefault) {
        			event.preventDefault();
        		}
        		this.isDragging = false;
        		try {
        			var dt = event && event.dataTransfer ? event.dataTransfer : null;
        			if (dt && dt.files && dt.files.length > 0) {
        				this.addFiles(dt.files, true);
        			}
        		} catch (e) {}
        	}
        	/*End_c8o_CompFunction*/
        '

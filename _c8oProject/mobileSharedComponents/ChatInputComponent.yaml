        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	onFileUploaded(file: any) {
        		if (this.Files) {
        			let len = this.Files.length;
        			for (let i=0; i<len; i++) {
        				let f = this.Files[i];
        				if (f.name == file.filename) {
        					const reader = new FileReader();
        					reader.onload = (e) => {
        					  this.imagePreview = e.target?.result;
        					};
        					reader.readAsDataURL(f);
        				}
        			};
        		} else {
        		  this.imagePreview = null;
        		}
        	}
        	
        	onFileSelected(event: any) {
        		this.Files = event.target.files;
        		this.FilesAdded.emit({files: this.Files});
        	}
        	
        	onKeyEnter(event: KeyboardEvent): void {
        	    if (event.key === ''Enter'') {
        	      event.preventDefault();
        	      this.sendMessage();
        	    }
        	}
        	
        	sendMessage() {
        		this.RunQuestion.emit({});
        	}
        	/*End_c8o_CompFunction*/
        '
↓Fragment [ngx.components.UICustom-1749652210265]: 
  htmlTemplate: |
    <!-- Prévisualisation de l'image -->
    <div *ngIf="imagePreview" class="preview-container">
    <ion-icon name="close-circle" class="remove-icon" (click)="removeImage()"></ion-icon>
      <img [src]="imagePreview" alt="Prévisualisation" class="preview-image" />
    </div>
    
    
    <ion-item lines="none" class="chat-input-container">
      <ion-icon name="add-outline" slot="start" (click)="fileInput.click()" title="Add file"></ion-icon>
      <input
        type="file"
        hidden
        accept="image/*"
        (change)="onFileSelected($event)"
        #fileInput
      />
      
      <ion-input
        [(ngModel)]="this.Question"
        placeholder="Poser une question"
    	aria-label="question input"
        class="chat-text-input"
        clearInput
    	(keydown)="this.onKeyEnter($event)"
      ></ion-input>
    
      <ion-icon name="mic-outline" slot="end"></ion-icon>
      <ion-button fill="clear" slot="end" (click)="sendMessage()">
        <ion-icon name="send" title="Soumettre"></ion-icon>
      </ion-button>
    </ion-item>
    
    

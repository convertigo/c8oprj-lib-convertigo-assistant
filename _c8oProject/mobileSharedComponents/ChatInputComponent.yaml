        '/*Begin_c8o_CompImport*/
        import { ViewChild } from ''@angular/core'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	@ViewChild("btnReset", { static: false }) public btnReset;
        	disabled = false;
        	previews = {};
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	setEnable(enable) {
        		this.disabled = !enable;
        		this.tick();
        		//this.c8o.log.warn("disabled:"+ this.disabled);
        	}
        	
        	previewImage(f) {
        		const reader = new FileReader();
        		reader.onload = (e) => {
        		  this.previews[f.name] = e.target?.result;
        		};
        		reader.readAsDataURL(f);
        	}
        	
        	onFileSelected(event: any) {
        		this.Files = event.target.files;
        		
        		this.previews = {};
        		for (let i=0; i< this.Files.length; i++) {
        			this.previewImage(this.Files[i]);
        		}
        	}
        	
        	onKeyEnter(event: KeyboardEvent): void {
        	    if (event.key === ''Enter'') {
        	      event.preventDefault();
        	      this.sendMessage();
        	    }
        	}
        	
        	sendMessage() {
        		this.RunQuestion.emit({files: this.Files});
        	}
        	
        	reset() {
        		try {
        			//console.log("btnReset", this.btnReset.nativeElement);
        			this.btnReset.nativeElement.click();
        			console.log("btnReset clicked");
        		} catch(e) {
        			console.log("error", e);
        		}
        		
        		this.Files = null;
        		this.Question = '''';
        		this.previews = {};
        		this.local.AIFiles = [];
        		console.log("chatinput reset");
        	}
        	/*End_c8o_CompFunction*/
        '
↓Fragment [ngx.components.UICustom-1749652210265]: 
  htmlTemplate: |
    <ion-item lines="none" [disabled]="this.disabled" class="chat-input-container">
      <ion-icon name="add-outline" slot="start" (click)="fileInput.click()" title="Add image"></ion-icon>
      <form>
    	  <input
    	    type="file"
    	    hidden
    	    accept="image/*"
    	    (change)="onFileSelected($event)"
    	    #fileInput
    	  />
    	  <button hidden type="reset" #btnReset >Reset form</button>
      </form>
      <ng-container *ngFor="let File of Files">
    	<img *ngIf="this.previews[File.name]" [src]="this.previews[File.name]" class="preview-image" />
      </ng-container>
      <ion-input
        [(ngModel)]="this.Question"
        placeholder="Poser une question"
    	aria-label="question input"
        class="chat-text-input"
        clearInput
    	(keydown)="this.onKeyEnter($event)"
      ></ion-input>
    
      <ion-icon name="mic-outline" slot="end"></ion-icon>
      <ion-button fill="clear" slot="end" (click)="sendMessage()">
        <ion-icon name="send" title="Soumettre"></ion-icon>
      </ion-button>
    </ion-item>
    

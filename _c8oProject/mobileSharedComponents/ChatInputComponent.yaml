          '.chat-input-container {
            border-radius: 10px;
            background: #f9f9f9;
            padding: 8px;
            margin: 5px;
            align-items: center;
          
            ion-input {
              flex: 1;
              margin: 0 5px;
            }
          
            ion-icon {
              font-size: 22px;
              padding: 0 5px;
              cursor: pointer;
            }
          
            ion-button {
              margin-left: 5px;
            }
          }
          
          .preview-container {
            position: relative;
            max-width: 50%;
            margin: 10px auto;
            border-radius: 12px;
            overflow: hidden;
            //box-shadow: 0 2px 8px rgba(0,0,0,0.1);
          }
          
          .preview-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
          }
          
          .remove-icon {
            position: absolute;
            top: -1px;
            left: -4px;
            font-size: 22px;
            color: #f44336;
            background: white;
            border-radius: 50%;
            padding: 0px;
            cursor: pointer;
          }'

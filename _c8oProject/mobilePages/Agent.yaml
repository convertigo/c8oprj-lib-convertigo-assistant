comment: Agent AI entry page
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		try {
        			var thread = '':threadid'';
        			try {
        				if (this.navParams && this.navParams.data && this.navParams.data.threadid && this.navParams.data.threadid !== '':threadid'') {
        					thread = this.navParams.data.threadid;
        				}
        			} catch (e1) {}
        			try {
        				if ((!thread || thread === '':threadid'') && this.route && this.route.snapshot && this.route.snapshot.paramMap) {
        					thread = this.route.snapshot.paramMap.get(''threadid'') || '':threadid'';
        				}
        			} catch (e2) {}
        			if (this.angularRouter && this.angularRouter.navigate) {
        				var queryParams: any = {};
        				try {
        					var searchParams = new URLSearchParams(window.location.search || '''');
        					searchParams.forEach(function(value, key) { queryParams[key] = value; });
        				} catch (eQuery) {}
        				queryParams.agentBridge = ''1'';
        				// The app onAppInit event defines the release switch, and a cold opening of this page (the C8Oforms panel)
        				// can run before it. Wait for the switch rather than sending the user to How-To for good.
        				// The switch always opens the agent for the No Code and server surfaces (its first check): they need no wait, so a
        				// slow start of the app never sends the panel of No Code Studio to How-To, its address lost.
        				var surface = String(queryParams.assistantSurface || queryParams.assistantContext || queryParams.surface || '''').toLowerCase();
        				var explicit = [''server'', ''nocode'', ''c8oforms''].indexOf(surface) >= 0 || queryParams.assistantRuntime === ''server'';
        				var page = this, waited = 0;
        				var decide = function() {
        					var ready = page.global && typeof page.global.isAssistantAgentReleaseEnabled === ''function'';
        					if (!ready && !explicit && waited < 5000) {
        						waited += 50;
        						setTimeout(decide, 50);
        					} else if (ready ? page.global.isAssistantAgentReleaseEnabled() : explicit) {
        						page.angularRouter.navigate([''/path-to-xfirst'', thread], { queryParams: queryParams, preserveFragment: true, replaceUrl: true });
        					} else {
        						page.angularRouter.navigate([''/path-to-lightrag''], { preserveFragment: true, replaceUrl: true });
        					}
        				};
        				decide();
        			}
        		} catch (e) {}
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageFunction*/
        	/*End_c8o_PageFunction*/'
segment: path-to-agent/:threadid
title: Tigo the agent
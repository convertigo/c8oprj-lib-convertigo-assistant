                '		try {
                			page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                
                			
                			page.c8o.callJsonObject(''ConvertigoAssistant.GetTokenBuffer'', {
                				"__context": "byside"
                			}).async().then((r) => {
                				var buffer = JSON.parse(r.C8OAiAssistantBuffer);
                				page.local.Buffer = buffer;
                				page.local.Buffer.intId = intId
                			})
                
                			// call every second the GetTokenBuffer sequence
                			let intId = window.setInterval(() => {
                				page.c8o.callJsonObject(''ConvertigoAssistant.GetTokenBuffer'', {
                					"__context": "byside"
                				}).async().then((r) => {
                					var buffer = JSON.parse(r.C8OAiAssistantBuffer);
                					page.local.Buffer = buffer;
                					page.local.Buffer.intId = intId
                				})
                			}, 1000);
                			
                		} catch (e) {
                		
                		} finally {
                			return;
                		}
                '

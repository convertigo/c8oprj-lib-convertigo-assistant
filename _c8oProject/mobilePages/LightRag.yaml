        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public mdtext = "";
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.c8o.log.debug("[Assistant] navParams: "+ JSON.stringify(this.navParams));
        		console.log("[Assistant] navParams ", this.navParams);
        		
        		this.mdtext = `
        		## Markdown __rulez__!
        		---
        
        		### Syntax highlight
        		\`\`\`typescript
        		const language = ''typescript'';
        		\`\`\`
        
        		### Lists
        		1. Ordered list
        		2. Another bullet point
        		   - Unordered list
        		   - Another unordered bullet
        
        		### Blockquote
        		> Blockquote to the max
        
        		### Links
        		[Duck Duck Go](https://duckduckgo.com "The best search engine for privacy")
        
        		it was a [hobbit-hole][1], and that means comfort
        
        		[1]: <https://en.wikipedia.org/wiki/Hobbit#Lifestyle> "Hobbit lifestyles"
        		
        		`;
        		
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public setChatImage(filedata, filename, filetype) {
        		if (this.global.studio) {
        			this.chatinput.setImage(filedata, filename, filetype);
        		}
        	}
        	
        	public setEnableChat() {
        		if (this.global.studio) {
        			let enable = true;
        			this.chatinput.setEnable(enable);
        		}
        	}
        	
        	public getProjectHeading() {
        		if (this.global.studio) {
        			if (this.global.projectName == undefined || this.global.projectName === "") {
        				return ": Please select an NGX project !"
        			}
        			return ": creation for " + this.global.projectName;
        		}
        		return ": " + this.local.Conversation;
        	}
        	/*End_c8o_PageFunction*/
        '

        	public getLocalThreadId() {
        		let threadid = null;
        		this.c8o.log.warn("[Assistant] navParams: "+ JSON.stringify(this.navParams));
        		console.log("[Assistant] navParams ", this.navParams);
        		try {
        			if (this.navParams.data["threadid"]) {
        				if (this.navParams.data["threadid"] != ":threadid") {
        					threadid = this.navParams.data["threadid"];
        				}
        			}
        		} catch (e) {}
        		this.c8o.log.warn("[Assistant] loading with threadid: "+ threadid);
        		this.log("[Assistant] loading with threadid: "+ threadid);
        		return threadid;
        	}
        	/*End_c8o_PageFunction*/

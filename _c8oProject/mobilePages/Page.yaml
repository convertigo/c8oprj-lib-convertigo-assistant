↓Subscribe_Handler [ngx.components.UIEventSubscriber-1744356866759]: 
  topic: AssistantResponse
  ↓AddAssitantMessages [ngx.components.UICustomAction-1744304995983]: 
    actionValue: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
            		let blocks = null;		
            		
            		function parseAndExtractCodeBlocks(content) {
            			// Regex to match ### filename followed by a code block
            			const regex = /### (.+?)\n+```(?:[\w]*)\n([\s\S]*?)```/g;
            
            			const extracted = {};
            			let match;
            
            			while ((match = regex.exec(content)) !== null) {
            			  const filename = match[1].trim();
            			  const code = match[2].trim();
            			  extracted[filename] = code;
            			}
            			page.c8o.log.debug("extracted code blocks" + JSON.stringify(extracted));
            			return extracted
            		}
            		
            		// iterate over all the vars.response and push them to the local messages
            		if (vars.response == null) {
            			resolve();
            			return;
            		}
            		
            		page.c8o.log.debug("==== vars.response" + JSON.stringify(vars.response));
            		
            		for (let i = 0; i < vars.response.length; i++) {
            			if (vars.response[i].role == "assistant" && vars.response[i].text != null && vars.response[i].text != "") {
            				// check if the message is already in the local messages
            				let found = false;
            				for (let j = 0; j < page.local.Messages.length; j++) {
            					if (page.local.Messages[j].id == vars.response[i].id) {
            						found = true;
            					}
            				}
            
            				// if found, do nothing
            				if (found) {
            					continue;
            				}
            									
            				let msg = {
            					type: "assistant",
            					msg: vars.response[i].text,
            					id: vars.response[i].id,
            				}
            				page.local.Messages.push(msg)
            				blocks = parseAndExtractCodeBlocks(msg.msg);
            			}
            		}
            		
            		resolve(blocks);
            '

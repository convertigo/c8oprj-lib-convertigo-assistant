      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	private threadid = null;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		//this.c8o.log.debug("[Assistant] navParams: "+ JSON.stringify(this.navParams));
        		console.log("[Assistant] navParams ", this.navParams);
        		try {
        			this.threadid = null;
        			if (this.navParams.data["threadid"]) {
        				if (this.navParams.data["threadid"] != ":threadid") {
        					this.threadid = this.navParams.data["threadid"];
        				}
        			}
        		} catch (e) {}
        		this.c8o.log.debug("[Assistant] loading with threadid: "+ this.threadid);
        		this.log("[Assistant] loading with threadid: "+ this.threadid);
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		this.ensureFooterInputs();
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageAfterViewInit*/
        		/*End_c8o_PageAfterViewInit*/
        /*Begin_c8o_PageFinalization*/
        		/*End_c8o_PageFinalization*/
        /*Begin_c8o_PageFunction*/
        	public debug() {
        		if (this.global.studio) {
        			this.c8o.log.debug("[Page] this.threadid: "+ this.threadid);
        			this.c8o.log.debug("[Page] this.local.Conversation: "+ this.local.Conversation);
        			this.c8o.log.debug("[Page] this.isEditionMode: "+ this.isEditionMode());
        			this.c8o.log.debug("[Page] local: "+ JSON.stringify(this.local));
        			this.c8o.log.debug("[Page] global: "+ JSON.stringify(this.global));
        		}
        	}
        	
        	public getLocalThreadId() {
        		return this.threadid;
        	}
        	
        	public isEditionMode() {
        		return this.threadid === this.local.Conversation;
        	}
        	
        	getDefaultFooterSuggestions() {
        		return [
        			{ label: ''Login form'', question: ''Create a login form component with email/password validation, error messages, and submit loading state.'', icon: ''log-in-outline'' },
        			{ label: ''Data table'', question: ''Create a reusable data table component with sorting, pagination, search, and row actions.'', icon: ''grid-outline'' },
        			{ label: ''Dashboard cards'', question: ''Create KPI dashboard card components with icon, trend indicator, and responsive layout.'', icon: ''stats-chart-outline'' },
        			{ label: ''File uploader'', question: ''Create a drag-and-drop file uploader component with progress, type validation, and preview list.'', icon: ''cloud-upload-outline'' },
        			{ label: ''Modal dialog'', question: ''Create a reusable modal dialog component with title, content slot, and confirm/cancel actions.'', icon: ''browsers-outline'' },
        			{ label: ''Step wizard'', question: ''Create a multi-step wizard component with stepper navigation, validation per step, and final summary.'', icon: ''list-outline'' }
        		];
        	}
        	
        	ensureFooterInputs() {
        		if (!this.local) {
        			this.local = {};
        		}
        		if (!(this.local.QuickSuggestions && this.local.QuickSuggestions.length != null && this.local.QuickSuggestions.length > 0)) {
        			this.local.QuickSuggestions = this.getDefaultFooterSuggestions();
        		}
        		var placeholder = '''' + (this.local.QuestionPlaceholder == null ? '''' : this.local.QuestionPlaceholder);
        		if (!placeholder.trim().length) {
        			this.local.QuestionPlaceholder = ''Ask how to build something...'';
        		}
        		this.local.EnableVisionForPage = false;
        	}
        	
        	scrollChatBottom(delay, force = false) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (!self.local) {
        					self.local = {};
        				}
        				if (!force && self.local && self.local.AutoScrollEnabled === false) {
        					return;
        				}
        				if (force) {
        					self.local.AutoScrollLockUntil = Date.now() + 1200;
        				}
        				if (self.content && self.content.scrollToBottom) {
        					self.content.scrollToBottom(220);
        				}
        			} catch (e) {}
        		}, wait);
        	}
        	
        	handleContentScroll(event) {
        		try {
        			if (!this.local) {
        				this.local = {};
        			}
        			var detail = event && event.detail ? event.detail : {};
        			var scrollTop = Number(detail.scrollTop || 0);
        			var previousTop = Number(this.local.LastScrollTop);
        			var lockUntil = Number(this.local.AutoScrollLockUntil || 0);
        			if (isNaN(previousTop)) {
        				previousTop = scrollTop;
        			}
        			if (isNaN(lockUntil)) {
        				lockUntil = 0;
        			}
        			this.local.LastScrollTop = scrollTop;
        			if (Date.now() < lockUntil) {
        				return;
        			}
        			if ((previousTop - scrollTop) > 10 && this.local.AutoScrollEnabled !== false) {
        				this.local.AutoScrollEnabled = false;
        				this.tick();
        			}
        		} catch (e) {}
        	}
        	
        	enableAutoScroll() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.AutoScrollEnabled = true;
        		this.local.AutoScrollLockUntil = Date.now() + 1400;
        		this.tick();
        		this.scrollChatBottom(0, true);
        	}
        	
        	focusQuestionInput(delay) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (self.chatfooter && self.chatfooter.focusQuestionInput) {
        					self.chatfooter.focusQuestionInput(0);
        				} else if (self.chatfooter && self.chatfooter.focusQuestionInputAtEnd) {
        					self.chatfooter.focusQuestionInputAtEnd(0);
        				}
        			} catch (e) {}
        		}, wait);
        	}
        	
        	focusQuestionInputAtEnd(delay) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (self.chatfooter && self.chatfooter.focusQuestionInputAtEnd) {
        					self.chatfooter.focusQuestionInputAtEnd(0);
        				} else if (self.chatfooter && self.chatfooter.focusQuestionInput) {
        					self.chatfooter.focusQuestionInput(0);
        				}
        			} catch (e) {}
        		}, wait);
        	}
        	
        	setSuggestion(question) {
        		var text = '''' + (question == null ? '''' : question);
        		try {
        			if (!this.local) {
        				this.local = {};
        			}
        			this.local.Question = text;
        			if (this.chatfooter && this.chatfooter.setQuestionText) {
        				this.chatfooter.setQuestionText(text, false);
        			}
        			this.tick();
        			this.focusQuestionInputAtEnd(20);
        		} catch (e) {}
        	}
        	
        	public setChatImage(filedata, filename, filetype) {
        		if (!this.local) {
        			this.local = {};
        		}
        	}
        	
        	public setEnableChat() {
        		if (this.global && this.global.studio) {
        			var enable = this.isEditionMode();
        			if (!enable) {
        				enable = this.global.projectName != undefined && this.global.projectName !== "";
        			}
        			if (!this.local) {
        				this.local = {};
        			}
        			this.local.EnableChat = enable;
        			try {
        				if (this.chatfooter && this.chatfooter.setEnable) {
        					this.chatfooter.setEnable(enable);
        				}
        			} catch (e) {}
        			this.tick();
        		}
        	}
        	
        		public getProjectHeading() {
        			if (this.global.studio) {
        				if (this.isEditionMode()) {
        					let compname = this.global.threadQname;
        					try {compname = compname.substring(compname.lastIndexOf(".")+1)} catch (e) {}
        					return ": edition of " + compname;
        				}
        				if (this.global.projectName == undefined || this.global.projectName === "") {
        					return ": Please select an NGX project !"
        				}
        				return ": creation for " + this.global.projectName;
        			}
        			return ": " + this.local.Conversation;
        		}
        		
        		public getProjectSubtitle() {
        			let heading = "" + this.getProjectHeading();
        			while (heading.length > 0) {
        				let c = heading.charAt(0);
        				if (c === ":" || c === " ") {
        					heading = heading.substring(1);
        					continue;
        				}
        				break;
        			}
        			return "Project: " + heading;
        		}
        		/*End_c8o_PageFunction*/
        '

            public startAgentSetupMessage(providerLabel, installing = false) {
                if (!this.local) {
                    this.local = {};
                }
                if (!this.local.Messages) {
                    this.local.Messages = [];
                }
                var label = "" + (providerLabel || "agent");
                var messageId = "__agent_setup__";
                var target = null;
                for (var i = this.local.Messages.length - 1; i >= 0; i--) {
                    if (this.local.Messages[i] && this.local.Messages[i].id === messageId) {
                        target = this.local.Messages[i];
                        break;
                    }
                }
                if (target === null) {
                    target = {
                        id: messageId,
                        type: "assistant",
                        author: "Assistant",
                        tag1: "Diagnostic",
                        tag2: label,
                        tag3: "Agent"
                    };
                    this.local.Messages.push(target);
                }
                target.msg = installing ? ("Installation de " + label + " dans le workspace Convertigo.\n\nCette opération peut prendre plusieurs minutes.") : ("Vérification de " + label + " et de sa configuration locale.");
                target.status = installing ? "Installation en cours" : "Diagnostic en cours";
                target.writing = true;
                this.local.AgentSetupMessageId = messageId;
                this.local.IsProcessing = true;
                this.tick();
                this.scrollChatBottom(20);
            }
            public finishAgentSetupMessage(result, error = "") {
                if (!this.local) {
                    this.local = {};
                }
                if (!this.local.Messages) {
                    this.local.Messages = [];
                }
                var messageId = this.local.AgentSetupMessageId || "__agent_setup__";
                var target = null;
                for (var i = this.local.Messages.length - 1; i >= 0; i--) {
                    if (this.local.Messages[i] && this.local.Messages[i].id === messageId) {
                        target = this.local.Messages[i];
                        break;
                    }
                }
                if (target === null) {
                    target = { id: messageId, type: "assistant", author: "Assistant", tag1: "Diagnostic", tag2: "Agent", tag3: "Local" };
                    this.local.Messages.push(target);
                }
                var setup = result && result.setup ? result.setup : {};
                var detail = setup && setup.setup ? setup.setup : {};
                var installation = setup && setup.installation ? setup.installation : {};
                var provider = "" + ((result && result.provider) || (detail && detail.codex ? "codex" : "") || (this.getAgentProvider ? this.getAgentProvider() : "agent"));
                var label = this.getAgentProviderLabel ? this.getAgentProviderLabel(provider) : provider;
                var lines = [];
                if (error) {
                    lines.push("Diagnostic impossible.");
                    lines.push("" + error);
                } else if (result && result.ok === true) {
                    lines.push("Agent " + label + " prêt.");
                } else {
                    lines.push("Agent " + label + " non prêt.");
                }
                if (result && result.status) {
                    lines.push("Statut : " + result.status);
                }
                if (installation && installation.attempted === true) {
                    if (installation.installed === true) {
                        lines.push("Installation locale terminée.");
                    } else if (installation.reused === true) {
                        lines.push("Runtime local existant reutilise.");
                    } else {
                        lines.push("Installation executee.");
                    }
                }
                if (detail && detail.codex && detail.codex.path) {
                    lines.push("Codex : " + detail.codex.path);
                }
                if (detail && detail.vibe && detail.vibe.path) {
                    lines.push("Vibe : " + detail.vibe.path);
                }
                if (detail && detail.codexHome) {
                    lines.push("CODEX_HOME : " + detail.codexHome);
                }
                if (detail && detail.vibeHome) {
                    lines.push("VIBE_HOME : " + detail.vibeHome);
                }
                if (detail && detail.installDir) {
                    lines.push("Répertoire agent : " + detail.installDir);
                }
                if (setup && setup.skills && setup.skills.message) {
                    lines.push(setup.skills.message);
                }
                if (setup && setup.error) {
                    lines.push("Erreur : " + setup.error);
                }
                if (setup && setup.messages && setup.messages.length) {
                    for (var j = 0; j < setup.messages.length && j < 4; j++) {
                        var m = "" + setup.messages[j];
                        if (m.length && lines.indexOf(m) === -1) {
                            lines.push(m);
                        }
                    }
                }
                target.msg = lines.join("\n\n");
                target.status = result && result.ok === true ? "Agent prêt" : "Action requise";
                target.writing = false;
                this.local.IsProcessing = false;
                this.tick();
                this.scrollChatBottom(20);
            }
        	private worklogTrim(value) {
        		return ("" + (value == null ? "" : value)).replace(/^\s+|\s+$/g, "");
        	}
        	public formatAgentDuration(ms) {
        		var seconds = Math.max(0, Math.round(Number(ms || 0) / 1000));
        		if (seconds < 60) {
        			return seconds + " s";
        		}
        		var minutes = Math.floor(seconds / 60);
        		var rest = seconds % 60;
        		return minutes + " min" + (rest ? " " + rest + " s" : "");
        	}
        	public getProgressTitle(item) {
        		try {
        			var count = item && item.progressItems && item.progressItems.length ? item.progressItems.length : 0;
        			var start = Number(item && item.progressStartedAt ? item.progressStartedAt : 0);
        			var end = item && item.writing === true ? (new Date()).getTime() : Number(item && item.progressEndedAt ? item.progressEndedAt : 0);
        			var duration = start ? this.formatAgentDuration((end || (new Date()).getTime()) - start) : "0 s";
        			var suffix = count ? (" en " + count + " étape" + (count > 1 ? "s" : "")) : "";
        			return "A travaillé pendant " + duration + suffix;
        		} catch (e) {}
        		return item && item.progressTitle ? item.progressTitle : "A travaillé";
        	}
        	public getProgressToolSummary(step) {
        		var title = this.worklogTrim(step && (step.title || step.text)) || "Outil";
        		var status = this.worklogTrim(step && step.status).toLowerCase();
        		var count = Number(step && (step.callCount || (step.calls && step.calls.length) || 0));
        		var countLabel = count > 1 ? (count + " appels") : "";
        		var label = "";
        		if (status === "running" || status === "in_progress") {
        			label = "en cours";
        		} else if (status === "failed" || status === "error") {
        			label = "échec";
        		} else if (status === "completed" || status === "complete" || status === "success" || status === "succeeded") {
        			label = "terminé";
        		}
        		var parts = [title];
        		if (countLabel.length) {
        			parts.push(countLabel);
        		}
        		if (label.length) {
        			parts.push(label);
        		}
        		return parts.join(" · ");
        	}
        	public getProgressToolCalls(step) {
        		try {
        			if (step && step.calls && step.calls.length != null) {
        				var calls = [];
        				for (var i = 0; i < step.calls.length; i++) {
        					calls.push(step.calls[i]);
        				}
        				return calls;
        			}
        		} catch (e) {}
        		return [];
        	}
        	public hasProgressToolDetail(step) {
        		if (this.worklogTrim(step && step.detail).length) {
        			return true;
        		}
        		var calls = this.getProgressToolCalls(step);
        		for (var i = 0; i < calls.length; i++) {
        			if (this.worklogTrim(calls[i] && calls[i].detail).length) {
        				return true;
        			}
        		}
        		return false;
        	}
        	public getProgressToolCallSummary(call, index) {
        		var status = this.worklogTrim(call && call.status).toLowerCase();
        		var label = "";
        		if (status === "running" || status === "in_progress") {
        			label = "en cours";
        		} else if (status === "failed" || status === "error") {
        			label = "échec";
        		} else if (status === "completed" || status === "complete" || status === "success" || status === "succeeded") {
        			label = "terminé";
        		}
        		var title = "Appel " + (Number(index || 0) + 1);
        		return label.length ? (title + " · " + label) : title;
        	}
        	public getProgressToolDetail(step) {
        		var direct = this.worklogTrim(step && step.detail);
        		var calls = this.getProgressToolCalls(step);
        		if (!calls.length) {
        			if (direct.length > 1800) {
        				direct = direct.substring(0, 1800) + "…";
        			}
        			return direct;
        		}
        		var blocks = [];
        		for (var i = 0; i < calls.length; i++) {
        			var detail = this.worklogTrim(calls[i] && calls[i].detail);
        			if (!detail.length) {
        				continue;
        			}
        			if (detail.length > 1400) {
        				detail = detail.substring(0, 1400) + "…";
        			}
        			detail = detail.replace(/\x60\x60\x60/g, "''''''");
        			blocks.push("**" + this.getProgressToolCallSummary(calls[i], i) + "**\n\n\x60\x60\x60text\n" + detail + "\n\x60\x60\x60");
        		}
        		return blocks.join("\n\n");
        	}
        	public startAgentElapsedTicker() {
        		try {
        			if (this[''_agentElapsedTimer'']) {
        				return;
        			}
        			this[''_agentElapsedTimer''] = setInterval(() => {
        				try {
        					if (this.local && this.local.IsProcessing === true) {
        						this.tick();
        					}
        				} catch (e) {}
        			}, 1000);
        		} catch (e) {}
        	}
        	public stopAgentElapsedTicker() {
        		try {
        			if (this[''_agentElapsedTimer'']) {
        				clearInterval(this[''_agentElapsedTimer'']);
        				this[''_agentElapsedTimer''] = null;
        			}
        		} catch (e) {}
        	}
        
        	public closeConversationsPanel() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.ShowConversationPanel = false;
        		this.tick();
        	}

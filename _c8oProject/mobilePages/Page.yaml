                        '		try {
                        			page.c8o.log.debug(''[MB] '' + props.actionFunction + '': '' + props.actionName);
                        			if (!page.local) {
                        				page.local = {};
                        			}
                        			if (!page.local.Buffer) {
                        				page.local.Buffer = {};
                        			}
                        			if (page.local.Buffer.intId) {
                        				window.clearInterval(page.local.Buffer.intId);
                        			}

                        			var trimText = function(value) {
                        				return ("" + (value == null ? "" : value)).replace(/^\s+|\s+$/g, "");
                        			};
                        			var localizeProgress = function(value) {
                        				var line = trimText(value);
                        				var key = line.toLowerCase();
                        				var map = {
                        					"i am preparing the local agent.": "Je prépare l''agent local.",
                        					"i am analyzing the request.": "J''analyse la demande.",
                        					"i am inspecting the convertigo project structure.": "J''inspecte la structure du projet Convertigo.",
                        					"i am applying a change in the project.": "J''applique une modification dans le projet.",
                        					"i am using a convertigo tool.": "J''utilise un outil Convertigo.",
                        					"a tool attempt failed, i am trying another path.": "Une tentative d''outil a échoué, je cherche une autre piste.",
                        					"i am checking available convertigo components.": "Je vérifie les composants Convertigo disponibles.",
                        					"i am restarting the application to verify the screen.": "Je relance l''application pour vérifier l''écran.",
                        					"i am testing a sequence or transaction.": "Je teste une séquence ou une transaction.",
                        					"i am reading files.": "Je lis les fichiers du projet.",
                        					"i am searching code.": "Je recherche dans le code.",
                        					"i am writing.": "J''écris la réponse."
                        				};
                        				return map[key] || line;
                        			};
                        			var isGenericProgress = function(value) {
                        				var text = trimText(value).toLowerCase();
                        				return !text.length || text === "writing" || text === "agent is working" || text === "agent is working..." || text === "assistant is writing" || text === "assistant is writing..." || text === "traitement en cours" || text === "traitement en cours...";
                        			};
                        			var isLowSignalProgress = function(value) {
                        				var text = trimText(value).toLowerCase();
                        				return text === "je prepare l''agent local." || text === "je prépare l''agent local." || text === "i am preparing the local agent.";
                        			};
                        			var normalizeProgressLines = function(progress, phase) {
                        				var raw = ("" + (progress == null ? "" : progress)).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
                        				var lines = [];
                        				for (var i = 0; i < raw.length; i++) {
                        					var line = localizeProgress(raw[i]);
                        					if (isGenericProgress(line) || line.indexOf("Sending data to the AI assistant") === 0) {
                        						continue;
                        					}
                        					if (lines.length && lines[lines.length - 1] === line) {
                        						continue;
                        					}
                        					if (lines.indexOf(line) === -1) {
                        						lines.push(line);
                        					}
                        				}
                        				var p = localizeProgress(phase);
                        				if (!isGenericProgress(p) && lines.indexOf(p) === -1) {
                        					lines.push(p);
                        				}
                        				if (lines.length > 1) {
                        					var filtered = [];
                        					for (var j = 0; j < lines.length; j++) {
                        						if (!isLowSignalProgress(lines[j])) {
                        							filtered.push(lines[j]);
                        						}
                        					}
                        					if (filtered.length) {
                        						lines = filtered;
                        					}
                        				}
                        				return lines;
                        			};
                        			var progressSnapshot = function(progress, phase) {
                        				var lines = normalizeProgressLines(progress, phase);
                        				if (lines.length > 12) {
                        					lines = lines.slice(lines.length - 12);
                        				}
                        				return {
                        					text: lines.join("\n\n"),
                        					status: lines.length ? lines[lines.length - 1] : "",
                        					lines: lines,
                        					hasLines: lines.length > 0
                        				};
                        			};
                        			var appendProgressSnapshot = function(snapshot, runKey) {
                        				var key = "" + (runKey || page.local.RunID || "pending");
                        				if (!page.local.AgentProgressHistory || page.local.AgentProgressHistoryRunId !== key) {
                        					page.local.AgentProgressHistory = [];
                        					page.local.AgentProgressHistoryRunId = key;
                        				}
                        				var history = page.local.AgentProgressHistory;
                        				var lines = snapshot && snapshot.lines ? snapshot.lines : [];
                        				for (var i = 0; i < lines.length; i++) {
                        					var line = localizeProgress(lines[i]);
                        					if (!isGenericProgress(line) && history.indexOf(line) === -1) {
                        						history.push(line);
                        					}
                        				}
                        				while (history.length > 12) {
                        					history.shift();
                        				}
                        				return {
                        					text: history.join("\n\n"),
                        					status: history.length ? history[history.length - 1] : "",
                        					hasLines: history.length > 0
                        				};
                        			};
                        			var renderProgress = function(buffer) {
                        				var idx = page.local.StreamingIndex;
                        				if (idx == null || !page.local.Messages || !page.local.Messages[idx]) {
                        					return;
                        				}
                        				var current = page.local.Messages[idx];
                        				var phase = buffer && buffer.phase != null ? trimText(buffer.phase) : "";
                        				var progress = "";
                        				if (buffer && buffer.progress != null) {
                        					progress = "" + buffer.progress;
                        				} else if (buffer && buffer.content != null) {
                        					progress = "" + buffer.content;
                        				} else if (buffer && buffer.text != null) {
                        					progress = "" + buffer.text;
                        				}
                        				var snapshot = appendProgressSnapshot(progressSnapshot(progress, phase), buffer && buffer.runid);
                        				if (!snapshot.hasLines) {
                        					if (trimText(current.msg).length || trimText(current.status).length) {
                        						return;
                        					}
                        					snapshot = { text: "Traitement en cours.", status: "Traitement en cours.", hasLines: true };
                        				}
                        				current.msg = snapshot.text;
                        				current.status = snapshot.status;
                        				current.writing = true;
                        			};

                        			var intervalId = null;
                        			var pullBuffer = function() {
                        				page.c8o.callJsonObject(''ConvertigoAssistant.GetTokenBuffer'', {
                        					"__context": "byside"
                        				}).async().then(function(r) {
                        					var rawBuffer = r ? r.C8OAiAssistantBuffer : null;
                        					if (rawBuffer == null) {
                        						return;
                        					}
                        					var buffer = null;
                        					if (typeof rawBuffer === "string") {
                        						if (!rawBuffer.length) {
                        							return;
                        						}
                        						try {
                        							buffer = JSON.parse(rawBuffer);
                        						} catch (e1) {
                        							return;
                        						}
                        					} else if (typeof rawBuffer === "object") {
                        						buffer = rawBuffer;
                        					}
                        					try {
                        						if (!buffer) {
                        							return;
                        						}
                        						page.local.Buffer = buffer;
                        						page.local.Buffer.intId = intervalId;
                        						renderProgress(buffer);
                        						page.tick();
                        						page.scrollChatBottom(0);
                        					} catch (e) {}
                        				}).catch(function() {});
                        			};
                        			pullBuffer();
                        			intervalId = window.setInterval(pullBuffer, 600);
                        			page.local.Buffer.intId = intervalId;
                        		} catch (e) {
                        			page.c8o.log.warn("[MB] ERROR : " + e.message);
                        		} finally {
                        			return;
                        		}

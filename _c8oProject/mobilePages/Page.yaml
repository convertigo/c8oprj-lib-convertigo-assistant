        	public debug() {
        		if (this.global && this.global.studio) {
        			this.c8o.log.debug("[Page] this.threadid: "+ this.threadid);
        			this.c8o.log.debug("[Page] this.local.Conversation: "+ (this.local ? this.local.Conversation : ""));
        			this.c8o.log.debug("[Page] this.isEditionMode: "+ this.isEditionMode());
        			this.c8o.log.debug("[Page] local: "+ JSON.stringify(this.local));
        			this.c8o.log.debug("[Page] global: "+ JSON.stringify(this.global));
        		}
        	}

        	public getLocalThreadId() {
        		return this.threadid;
        	}

        	public isEditionMode() {
        		return this.local && this.threadid === this.local.Conversation;
        	}

        	t(key, fallback) {
        		try {
        			if (this.translate && this.translate.instant) {
        				var translated = "" + this.translate.instant(key);
        				if (translated && translated !== key) {
        					return translated;
        				}
        			}
        		} catch (e) {}
        		return "" + (fallback == null ? key : fallback);
        	}

        	getDefaultFooterSuggestions() {
        		return [
        			{ label: this.t("Component_Suggestion_1_Label", "Login form"), question: this.t("Component_Suggestion_1_Question", "Create a login form component with email/password validation, error messages, and submit loading state."), icon: "log-in-outline" },
        			{ label: this.t("Component_Suggestion_2_Label", "Data table"), question: this.t("Component_Suggestion_2_Question", "Create a reusable data table component with sorting, pagination, search, and row actions."), icon: "grid-outline" },
        			{ label: this.t("Component_Suggestion_3_Label", "Dashboard cards"), question: this.t("Component_Suggestion_3_Question", "Create KPI dashboard card components with icon, trend indicator, and responsive layout."), icon: "stats-chart-outline" },
        			{ label: this.t("Component_Suggestion_4_Label", "File uploader"), question: this.t("Component_Suggestion_4_Question", "Create a drag-and-drop file uploader component with progress, type validation, and preview list."), icon: "cloud-upload-outline" },
        			{ label: this.t("Component_Suggestion_5_Label", "Modal dialog"), question: this.t("Component_Suggestion_5_Question", "Create a reusable modal dialog component with title, content slot, and confirm/cancel actions."), icon: "browsers-outline" },
        			{ label: this.t("Component_Suggestion_6_Label", "Step wizard"), question: this.t("Component_Suggestion_6_Question", "Create a multi-step wizard component with stepper navigation, validation per step, and final summary."), icon: "list-outline" }
        		];
        	}

        	getNoProjectSelectedMessage() {
        		return this.t("Project_Select_Required", "Project: Please select an NGX project !");
        	}

        	private cleanProjectName(value) {
        		return ("" + (value == null ? "" : value)).replace(/^\s+|\s+$/g, "");
        	}

        public getAgentProvider() {
            var provider = "";
            try {
                provider = this.cleanProjectName(this.local && this.local.AgentProvider);
            } catch (e0) {}
            try {
                if (!provider.length) {
                    provider = this.cleanProjectName(this.global && (this.global.agentProvider || this.global.aiAgentProvider || this.global.provider));
                }
            } catch (e) {}
            try {
                if (!provider.length && this.navParams && this.navParams.data) {
                    provider = this.cleanProjectName(this.navParams.data.agentProvider || this.navParams.data.aiAgentProvider || this.navParams.data.provider || this.navParams.data.agent);
                }
            } catch (e2) {}
            try {
                if (!provider.length && typeof window !== "undefined" && window.location) {
                    var params = new URLSearchParams(window.location.search || "");
                    provider = this.cleanProjectName(params.get("agentProvider") || params.get("aiAgentProvider") || params.get("provider") || params.get("agent"));
                }
            } catch (e3) {}
            provider = provider.toLowerCase();
            if (provider === "codex-cli" || provider === "openai-codex") {
                return "codex";
            }
            if (provider === "mistral-vibe" || provider === "vibe-acp") {
                return "vibe";
            }
            return provider.length ? provider : "vibe";
        }

        public getAgentProviderLabel(provider = null) {
            var p = this.cleanProjectName(provider == null ? this.getAgentProvider() : provider).toLowerCase();
            return p === "codex" ? "Codex" : "Vibe";
        }

        public getDefaultAgentModel(provider = null) {
            var p = this.cleanProjectName(provider || this.getAgentProvider()).toLowerCase();
            return p === "codex" ? "" : "vibe-thinking";
        }

        public getAgentModelOptions(provider = null) {
            var p = this.cleanProjectName(provider || this.getAgentProvider()).toLowerCase();
            if (p === "codex") {
                return [
                    { id: "", label: "Codex default" },
                    { id: "gpt-5-codex", label: "GPT-5 Codex" },
                    { id: "gpt-5", label: "GPT-5" }
                ];
            }
            return [
                { id: "vibe-thinking", label: "Vibe thinking" },
                { id: "mistral-medium-3.5", label: "Mistral medium" },
                { id: "devstral-small-latest", label: "Devstral" }
            ];
        }

        public getAgentModel() {
            var model = "";
            try {
                model = this.cleanProjectName(this.local && this.local.AgentModel);
            } catch (e0) {}
            try {
                if (!model.length) {
                    model = this.cleanProjectName(this.global && (this.global.agentModel || this.global.aiAgentModel || this.global.model));
                }
            } catch (e) {}
            try {
                if (!model.length && this.navParams && this.navParams.data) {
                    model = this.cleanProjectName(this.navParams.data.agentModel || this.navParams.data.aiAgentModel || this.navParams.data.model);
                }
            } catch (e2) {}
            try {
                if (!model.length && typeof window !== "undefined" && window.location) {
                    var params = new URLSearchParams(window.location.search || "");
                    model = this.cleanProjectName(params.get("agentModel") || params.get("aiAgentModel") || params.get("model"));
                }
            } catch (e3) {}
            if (model.toLowerCase() === "default" || model.toLowerCase() === "auto") {
                return this.getAgentProvider() === "codex" ? "" : this.getDefaultAgentModel();
            }
            return model.length ? model : this.getDefaultAgentModel();
        }

        public getAgentModelLabel(model = null, provider = null) {
            var value = model == null ? this.getAgentModel() : this.cleanProjectName(model);
            var options = this.getAgentModelOptions(provider);
            for (var i = 0; i < options.length; i++) {
                if (options[i].id === value) {
                    return options[i].label;
                }
            }
            return value.length ? value : "Codex default";
        }

        public getNewConversationLabel() {
            var project = (this.getEffectiveProjectName && this.getEffectiveProjectName().length) ? this.getEffectiveProjectName() : "le projet sélectionné";
            return "Démarrer avec " + this.getAgentProviderLabel() + " · " + this.getAgentModelLabel() + " pour " + project;
        }

        public getConversationAgentLabel(conversation) {
            var provider = conversation && conversation.provider ? this.cleanProjectName(conversation.provider).toLowerCase() : this.getAgentProvider();
            var model = conversation && conversation.model != null ? this.cleanProjectName(conversation.model) : this.getDefaultAgentModel(provider);
            return this.getAgentProviderLabel(provider) + " · " + this.getAgentModelLabel(model, provider);
        }

        public setAgentProvider(provider) {
            if (!this.local) {
                this.local = {};
            }
            this.local.AgentProvider = this.cleanProjectName(provider).toLowerCase() || "vibe";
            this.local.AgentModel = this.getDefaultAgentModel(this.local.AgentProvider);
            this.tick();
        }

        public setAgentModel(model) {
            if (!this.local) {
                this.local = {};
            }
            this.local.AgentModel = this.cleanProjectName(model);
            this.tick();
        }

        	private projectNameFromRecord(record) {
        		if (!record) {
        			return "";
        		}
        		var project = this.cleanProjectName(record.primaryProject || record.projectId || record.targetProject || record.projectName);
        		if (project.length) {
        			return project;
        		}
        		try {
        			if (record.projectNames && record.projectNames.length) {
        				return this.cleanProjectName(record.projectNames[0]);
        			}
        		} catch (e) {}
        		return "";
        	}

        	private getConversationProjectFromList(conversationId) {
        		try {
        			var conversations = this.local && this.local.AgentConversations ? this.local.AgentConversations : [];
        			var id = this.cleanProjectName(conversationId || (this.local ? this.local.Conversation : ""));
        			for (var i = 0; i < conversations.length; i++) {
        				var item = conversations[i];
        				if (!id.length || (item && item.conversationId === id)) {
        					var project = this.projectNameFromRecord(item);
        					if (project.length) {
        						return project;
        					}
        				}
        			}
        		} catch (e) {}
        		return "";
        	}

        	public getEffectiveProjectName() {
        		var project = "";
        		try {
        			project = this.cleanProjectName(this.global && this.global.projectName);
        			if (project.length) {
        				return project;
        			}
        		} catch (e) {}
        		try {
        			project = this.cleanProjectName(this.local && this.local.ConversationProject);
        			if (project.length) {
        				return project;
        			}
        		} catch (e2) {}
        		return this.getConversationProjectFromList(null);
        	}

        	public setConversationProject(project) {
        		if (!this.local) {
        			this.local = {};
        		}
        		var value = this.cleanProjectName(project);
        		if (value.length) {
        			this.local.ConversationProject = value;
        		}
        		return value;
        	}

        	public setConversationProjectFromData(data, state) {
        		var project = this.projectNameFromRecord(state) || this.projectNameFromRecord(data) || this.projectNameFromRecord(data && data.state);
        		if (!project.length) {
        			project = this.getConversationProjectFromList(data && data.id ? data.id : null);
        		}
        		if (project.length) {
        			this.setConversationProject(project);
        			this.setEnableChat();
        		}
        		return project;
        	}

        	syncFooterPlaceholder() {
        		if (!this.local) {
        			this.local = {};
        		}
        		if (this.local.EnableChat === false) {
        			this.local.QuestionPlaceholder = this.getNoProjectSelectedMessage();
        			return;
        		}
        		var placeholder = "" + (this.local.QuestionPlaceholder == null ? "" : this.local.QuestionPlaceholder);
        		if (!placeholder.trim().length || placeholder === this.getNoProjectSelectedMessage()) {
        			this.local.QuestionPlaceholder = this.t("Question_Placeholder", "Ask how to build something...");
        		}
        	}

        	refreshFooterLocale() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.QuickSuggestions = this.getDefaultFooterSuggestions();
        		this.local.QuestionPlaceholder = this.t("Question_Placeholder", "Ask how to build something...");
        		this.syncFooterPlaceholder();
        		this.tick();
        	}

        	ensureFooterInputs() {
                if (!this.local) {
                    this.local = {};
                }
                if (!(this.local.QuickSuggestions && this.local.QuickSuggestions.length != null && this.local.QuickSuggestions.length > 0)) {
                    this.local.QuickSuggestions = this.getDefaultFooterSuggestions();
                }
                if (this.local.ShowConversationPanel == null) {
                    this.local.ShowConversationPanel = false;
                }
                if (!this.local.AgentProvider) {
                    this.local.AgentProvider = this.getAgentProvider();
                }
                if (this.local.AgentModel == null) {
                    this.local.AgentModel = this.getAgentModel();
                }
                this.syncFooterPlaceholder();
                this.local.EnableVisionForPage = false;
            }

        	scrollChatBottom(delay, force = false) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (!self.local) {
        					self.local = {};
        				}
        				if (!force && self.local && self.local.AutoScrollEnabled === false) {
        					return;
        				}
        				if (force) {
        					self.local.AutoScrollLockUntil = Date.now() + 1200;
        				}
        				if (self.content && self.content.scrollToBottom) {
        					self.content.scrollToBottom(220);
        				}
        			} catch (e) {}
        		}, wait);
        	}

        	scrollChatTop(delay, force = false) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (!self.local) {
        					self.local = {};
        				}
        				if (force) {
        					self.local.AutoScrollEnabled = false;
        					self.local.AutoScrollLockUntil = Date.now() + 500;
        				}
        				if (self.content && self.content.scrollToTop) {
        					self.content.scrollToTop(220);
        				}
        			} catch (e) {}
        		}, wait);
        	}

        	handleContentScroll(event) {
        		try {
        			if (!this.local) {
        				this.local = {};
        			}
        			var detail = event && event.detail ? event.detail : {};
        			var scrollTop = Number(detail.scrollTop || 0);
        			var previousTop = Number(this.local.LastScrollTop);
        			var lockUntil = Number(this.local.AutoScrollLockUntil || 0);
        			var maxTop = Number(this.local.AutoScrollMaxTop);
        			var scrollHeight = Number(detail.scrollHeight || 0);
        			var contentHeight = Number(detail.contentHeight || detail.clientHeight || 0);
        			var distanceToBottom = -1;
        			var showTop = scrollTop > 160;
        			if (this.local.ShowScrollTopButton !== showTop) {
        				this.local.ShowScrollTopButton = showTop;
        				this.tick();
        			}
        			if (isNaN(previousTop)) {
        				previousTop = scrollTop;
        			}
        			if (isNaN(lockUntil)) {
        				lockUntil = 0;
        			}
        			if (isNaN(maxTop)) {
        				maxTop = scrollTop;
        			}
        			if (scrollHeight > 0 && contentHeight > 0) {
        				distanceToBottom = scrollHeight - (scrollTop + contentHeight);
        			}
        			this.local.LastScrollTop = scrollTop;
        			if (scrollTop > maxTop) {
        				this.local.AutoScrollMaxTop = scrollTop;
        				maxTop = scrollTop;
        			}
        			var isGoingUp = scrollTop < (previousTop - 1);
        			var isGoingDown = scrollTop > (previousTop + 1);
        			if (this.local.AutoScrollEnabled !== false && isGoingUp) {
        				this.local.AutoScrollEnabled = false;
        				this.local.AutoScrollLockUntil = Date.now() + 250;
        				this.tick();
        				return;
        			}
        			if (Date.now() < lockUntil) {
        				return;
        			}
        			if (this.local.AutoScrollEnabled === false) {
        				var nearBottom = false;
        				if (distanceToBottom >= 0) {
        					nearBottom = distanceToBottom <= 24;
        				} else {
        					nearBottom = scrollTop >= (maxTop - 24);
        				}
        				if (nearBottom && (isGoingDown || scrollTop >= (maxTop - 2))) {
        					this.local.AutoScrollEnabled = true;
        					this.local.AutoScrollLockUntil = Date.now() + 300;
        					this.tick();
        				}
        				return;
        			}
        			if ((previousTop - scrollTop) > 10 && this.local.AutoScrollEnabled !== false) {
        				this.local.AutoScrollEnabled = false;
        				this.tick();
        			}
        		} catch (e) {}
        	}

        	enableAutoScroll() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.AutoScrollEnabled = true;
        		this.local.AutoScrollLockUntil = Date.now() + 1400;
        		this.tick();
        		this.scrollChatBottom(0, true);
        	}

        	focusQuestionInput(delay) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (self.chatfooter && self.chatfooter.focusQuestionInput) {
        					self.chatfooter.focusQuestionInput(0);
        				} else if (self.chatfooter && self.chatfooter.focusQuestionInputAtEnd) {
        					self.chatfooter.focusQuestionInputAtEnd(0);
        				}
        			} catch (e) {}
        		}, wait);
        	}

        	focusQuestionInputAtEnd(delay) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (self.chatfooter && self.chatfooter.focusQuestionInputAtEnd) {
        					self.chatfooter.focusQuestionInputAtEnd(0);
        				} else if (self.chatfooter && self.chatfooter.focusQuestionInput) {
        					self.chatfooter.focusQuestionInput(0);
        				}
        			} catch (e) {}
        		}, wait);
        	}

        	setSuggestion(question) {
        		var text = "" + (question == null ? "" : question);
        		try {
        			if (!this.local) {
        				this.local = {};
        			}
        			this.local.Question = text;
        			if (this.chatfooter && this.chatfooter.setQuestionText) {
        				this.chatfooter.setQuestionText(text, false);
        			}
        			this.tick();
        			this.focusQuestionInputAtEnd(20);
        		} catch (e) {}
        	}

        	public setChatImage(filedata, filename, filetype) {
        		if (!this.local) {
        			this.local = {};
        		}
        	}

        	public setEnableChat() {
        		if (this.global && this.global.studio) {
        			var enable = this.isEditionMode() || this.getEffectiveProjectName().length > 0;
        			if (!this.local) {
        				this.local = {};
        			}
        			this.local.EnableChat = enable;
        			this.syncFooterPlaceholder();
        			try {
        				if (this.chatfooter && this.chatfooter.setEnable) {
        					this.chatfooter.setEnable(enable);
        				}
        			} catch (e) {}
        			this.tick();
        		}
        	}

        	public getProjectHeading() {
        		if (this.global && this.global.studio) {
        			if (this.isEditionMode()) {
        				let compname = this.global.threadQname;
        				try { compname = compname.substring(compname.lastIndexOf(".")+1); } catch (e) {}
        				return ": edition of " + compname;
        			}
        			var project = this.getEffectiveProjectName();
        			if (!project.length) {
        				return ": Please select an NGX project !";
        			}
        			return ": creation for " + project;
        		}
        		return ": " + (this.local ? this.local.Conversation : "");
        	}

        	public getProjectSubtitle() {
        		let heading = "" + this.getProjectHeading();
        		while (heading.length > 0) {
        			let c = heading.charAt(0);
        			if (c === ":" || c === " ") {
        				heading = heading.substring(1);
        				continue;
        			}
        			break;
        		}
        		return "Project: " + heading;
        	}

        	public GetProjectSubtitle() {
        		return this.getProjectSubtitle();
        	}

        	public toggleConversationsPanel() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.ShowConversationPanel = !this.local.ShowConversationPanel;
        		this.tick();
        	}

        	public closeConversationsPanel() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.ShowConversationPanel = false;
        		this.tick();
        	}
        	/*End_c8o_PageFunction*/

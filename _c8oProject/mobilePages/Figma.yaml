      actionValue: 
        - xmlizable: 
          - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
          - com.twinsoft.convertigo.beans.common.FormatedContent: 
            →: |
              '		let text = `
              		
              		<p align="center">
              		  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Figma-logo.svg/1667px-Figma-logo.svg.png" alt="Alt Text" width="60px"/>
              		</p>
              		
              		## Welcome to the Figma import assistant!  
              		  
              		Import your Figma designs as Convertigo Shared Components in a few clicks!
              		
              		### How to use it?
              		
              		1. Open your Figma design
              		2. Install the AutoHTML plugin <a href="https://www.figma.com/community/plugin/1077172952654000760/autohtml-components-to-code" target="_blank">(https://www.figma.com/community/plugin/1077172952654000760/autohtml-components-to-code)</a> in Figma
              		3. Select the component you want to export. Best results are achieved with components using Autolayout. Do not export a whole page but instead several components used to build the page 
              		4. Run the AutoHTML plugin (Works in Dev or Design mode)
              		5. Click the ''download ZIP'' button
              		6. Drag and drop the ZIP file on this assistant window.
              		
              		The Figma import assistant will create a new SharedComponent named from the Figma component name. All the text nodes will be automatically converted
              		to Convertigo Shared component variables. You will be free to rename the variables to meaningful names. Also all the images assets such as SVG, PNG,
              		JPG will be automatically copied the your project''s *assets* folder and reference to them will be automatically added to the SharedComponent variables.
              		
              		### Layer naming 
              		
              		By default the imported component will be based on DIV convertigo elements with the text nodes converted to variables. But you can also use layer names to create specific Convertigo elements.
              		
              		- Name a layer ''input-something'' to create a Convertigo Input Field
              		- Name a layer ''button-something'' to create a Convertigo Button
              		
              		The Figma import assistant will automatically create the corresponding Convertigo elements in the Shared Component and apply the correct CSS classes to them.		
              		 
              		`;
              		
              		let msg = {
              			type: "assistant",
              			msg: "\n" + text + "\n",
              			id: -1,
              		}
              		page.local.Messages.push(msg);
              		
              		resolve();
              '

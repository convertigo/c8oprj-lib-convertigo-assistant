  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public setEnableChat() {
        		if (this.global.studio) {
        			let enable = this.global.projectName != undefined && this.global.projectName !== "";
        			this.chatinput.setEnable(enable);
        		}
        	}
        	
        	scrollChatBottom(delay, force = false) {
        		var wait = delay == null ? 0 : delay;
        		var self = this;
        		setTimeout(function() {
        			try {
        				if (!self.local) {
        					self.local = {};
        				}
        				if (!force && self.local && self.local.AutoScrollEnabled === false) {
        					return;
        				}
        				if (force) {
        					self.local.AutoScrollLockUntil = Date.now() + 1200;
        				}
        				if (self.content && self.content.scrollToBottom) {
        					self.content.scrollToBottom(220);
        				}
        			} catch (e) {}
        		}, wait);
        	}
        	
        	handleContentScroll(event) {
        		try {
        			if (!this.local) {
        				this.local = {};
        			}
        			var detail = event && event.detail ? event.detail : {};
        			var scrollTop = Number(detail.scrollTop || 0);
        			var previousTop = Number(this.local.LastScrollTop);
        			var lockUntil = Number(this.local.AutoScrollLockUntil || 0);
        			var maxTop = Number(this.local.AutoScrollMaxTop);
        			var scrollHeight = Number(detail.scrollHeight || 0);
        			var contentHeight = Number(detail.contentHeight || detail.clientHeight || 0);
        			var distanceToBottom = -1;
        			if (isNaN(previousTop)) {
        				previousTop = scrollTop;
        			}
        			if (isNaN(lockUntil)) {
        				lockUntil = 0;
        			}
        			if (isNaN(maxTop)) {
        				maxTop = scrollTop;
        			}
        			if (scrollHeight > 0 && contentHeight > 0) {
        				distanceToBottom = scrollHeight - (scrollTop + contentHeight);
        			}
        			this.local.LastScrollTop = scrollTop;
        			if (scrollTop > maxTop) {
        				this.local.AutoScrollMaxTop = scrollTop;
        				maxTop = scrollTop;
        			}
        			var isGoingUp = scrollTop < (previousTop - 1);
        			var isGoingDown = scrollTop > (previousTop + 1);
        			if (this.local.AutoScrollEnabled !== false && isGoingUp) {
        				this.local.AutoScrollEnabled = false;
        				this.local.AutoScrollLockUntil = Date.now() + 250;
        				this.tick();
        				return;
        			}
        			if (Date.now() < lockUntil) {
        				return;
        			}
        			if (this.local.AutoScrollEnabled === false) {
        				var nearBottom = false;
        				if (distanceToBottom >= 0) {
        					nearBottom = distanceToBottom <= 24;
        				} else {
        					nearBottom = scrollTop >= (maxTop - 24);
        				}
        				if (nearBottom && (isGoingDown || scrollTop >= (maxTop - 2))) {
        					this.local.AutoScrollEnabled = true;
        					this.local.AutoScrollLockUntil = Date.now() + 300;
        					this.tick();
        				}
        				return;
        			}
        			if ((previousTop - scrollTop) > 10 && this.local.AutoScrollEnabled !== false) {
        				this.local.AutoScrollEnabled = false;
        				this.tick();
        			}
        		} catch (e) {}
        	}
        	
        	enableAutoScroll() {
        		if (!this.local) {
        			this.local = {};
        		}
        		this.local.AutoScrollEnabled = true;
        		this.local.AutoScrollLockUntil = Date.now() + 1400;
        		this.tick();
        		this.scrollChatBottom(0, true);
        	}
        	
        		public getProjectHeading() {
        			if (this.global.studio) {
        				if (this.global.projectName == undefined || this.global.projectName === "") {
        					return ": Please select an NGX project !"
        				}
        				return ": creation for " + this.global.projectName;
        			}
        			return "";
        		}
        		
        		public getProjectSubtitle() {
        			let heading = "" + this.getProjectHeading();
        			while (heading.length > 0) {
        				let c = heading.charAt(0);
        				if (c === ":" || c === " ") {
        					heading = heading.substring(1);
        					continue;
        				}
        				break;
        			}
        			return "Project: " + heading;
        		}
        		
        		public getTargetProjectLabel() {
        			if (this.global && this.global.projectName != undefined && this.global.projectName !== "") {
        				return "Target project: " + this.global.projectName;
        			}
        			return "Target project: Please select an NGX project";
        		}
        		
        		public getTargetProjectName() {
        			if (this.global && this.global.projectName != undefined && this.global.projectName !== "") {
        				return this.global.projectName;
        			}
        			return "Please select an NGX project";
        		}
        		/*End_c8o_PageFunction*/
        '
